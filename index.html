 {id:"o_hd",t:2,ex:1,q:"Wann und wie führen Sie eine hygienische Händedesinfektion durch?",
  pts:["Wirksamste Einzelmaßnahme gegen Infektionsketten","5 Indikationen: vor Patientenkontakt, vor aseptischer Tätigkeit, nach infektiösem Material, nach Patientenkontakt, nach Umgebung","Voraussetzungen: intakte Haut, kein Schmuck, kurze unlackierte Nägel","3–6 ml (2–4 Hübe) auf trockene Hände","Mind. 30 s feucht halten, 6 Schritte EN 1500, Fingerkuppen/Daumen/Nagelfalze","Handschuhe/Waschen sind kein Ersatz"],
  a:"Die hygienische Händedesinfektion ist die wirksamste Maßnahme, um Infektionsketten zu unterbrechen.\nIch desinfiziere nach den 5 Indikationen der WHO: vor dem Patientenkontakt, vor aseptischen Tätigkeiten, nach Kontakt mit infektiösem Material, nach dem Patientenkontakt und nach Kontakt mit der Patientenumgebung.\nVoraussetzung sind gesunde Haut, kein Schmuck und kurze Nägel ohne Lack.\nIch gebe 3 bis 6 ml auf die trockenen Hände und reibe mindestens 30 Sekunden nach den 6 Schritten der Einreibemethode ein. Besonders wichtig sind Fingerkuppen, Daumen und Nagelfalze.\nHandschuhe oder Händewaschen ersetzen die Desinfektion nicht."},
 {id:"o_waesche",t:2,ex:1,q:"Worauf achten Sie beim Bettwäschewechsel und im Umgang mit Rein- und Schmutzwäsche?",
  pts:["Prinzipien: Hygiene, Intimsphäre, Sicherheit, Patientenorientierung, Kommunikation, Ergonomie, Wirtschaftlichkeit","Händedesinfektion vor dem Betten, vor Reinwäsche, nach Schmutzwäsche","Reinwäsche: nur nötige Menge, Ablage vorher desinfizieren, nie Boden/Schmutzwäsche","Schmutzwäsche direkt in Sack am fahrbaren Sammler, beim Abwurf sortieren, nie auf Boden","Täglicher Wechsel bei MRE und Ektoparasiten; PSA bei Blut/Sekreten","Säcke verschließen, nicht überfüllen, im unreinen Arbeitsraum lagern"],
  a:"Beim Bettwäschewechsel achte ich auf Hygiene, Intimsphäre, Sicherheit, Kommunikation, Ergonomie und Wirtschaftlichkeit.\nVor dem Betten und vor der Reinwäsche desinfiziere ich die Hände.\nIch nehme nur so viel Reinwäsche mit, wie ich brauche. Wenn ich sie ablege, desinfiziere ich die Fläche vorher. Reinwäsche darf nie den Boden oder Schmutzwäsche berühren.\nDie Schmutzwäsche gebe ich sofort in den Wäschesack am Wagen und sortiere sie dabei. Ich lege sie nie auf den Boden oder einen Sessel.\nBei MRE oder Läusen wird die Wäsche täglich gewechselt. Bei Blut oder Sekreten trage ich Handschuhe und Schürze.\nZum Schluss desinfiziere ich wieder meine Hände."},
 {id:"o_gcs",t:1,ex:1,q:"Wie schätzen Sie die Bewusstseinslage ein? Erklären Sie die Glasgow Coma Scale.",
  pts:["Beobachtung: Ansprache, Schmerzreiz, Augen, Orientierung (Person, Zeit, Ort, Situation), Bewegung","Quantitative Stufen: Benommenheit, Somnolenz, Sopor, Koma","GCS: 3 Kategorien – Augen (4), Sprache (5), Motorik (6)","Summe 3–15; 15 beste, 3 tiefes Koma","Ablauf: prüfen, beobachten, stimulieren (Fingerspitzen, Trapezius, Foramen supraorbitale), nach höchster Reaktion einstufen"],
  a:"Ich prüfe, ob die Person auf Ansprache und auf Schmerzreiz reagiert, ob sie die Augen öffnet, ob sie zu Person, Zeit, Ort und Situation orientiert ist und ob sie Aufforderungen befolgt.\nQuantitative Störungen sind Benommenheit, Somnolenz, Sopor und Koma.\nDie Glasgow Coma Scale hat drei Bereiche: Augenöffnen mit maximal 4 Punkten, Sprache mit maximal 5 und Motorik mit maximal 6 Punkten. Die Summe liegt zwischen 3 und 15.\nZuerst prüfe ich, ob etwas die Antwort einschränkt, zum Beispiel eine Intubation. Dann beobachte und stimuliere ich, zuerst mit der Stimme, dann mit Druck auf Fingerspitze, Trapezius oder Augenbraue. Ich werte immer die beste Reaktion."},
 {id:"o_schlaf",t:1,q:"Ein Patient schläft im Krankenhaus schlecht. Was erheben Sie und was können Sie tun?",
  pts:["Schlafanamnese: Qualität, Dauer, Schlafmittel, Störfaktoren, Rituale","Störfaktoren KH: Schmerz, Pflegetätigkeiten, Lärm, Licht, Angst, Mehrbettzimmer, fremde Umgebung","Lösungen: Schmerztherapie, Tätigkeiten bündeln, Lärm/Licht reduzieren, Gespräch, Konsens, vertraute Gegenstände","Schlaffördernd: Tee, warme Milch, Fußbad, ASE, Aromapflege, Basale Stimulation","Hypnotika-Nachteile: Abhängigkeit, Rebound, Atemdepression, Muskelrelaxation (Sturz)"],
  a:"Zuerst mache ich eine Schlafanamnese: Wie lange und wie gut schläft er? Nimmt er Schlafmittel? Was stört ihn? Hat er Rituale?\nIm Krankenhaus stören oft Schmerzen, Lärm, Licht, Pflegetätigkeiten, Angst oder der Zimmernachbar.\nIch sorge für Schmerztherapie, plane Pflegetätigkeiten nicht in der Nacht, reduziere Lärm und Licht und biete ein Gespräch an. Im Mehrbettzimmer suche ich einen Konsens.\nIch kann Tee, warme Milch mit Honig, ein warmes Fußbad oder eine atemstimulierende Einreibung anbieten.\nSchlafmittel haben Nachteile wie Abhängigkeit, Atemdepression und Sturzgefahr."},
 {id:"o_ase",t:1,q:"Was ist die atemstimulierende Einreibung (ASE)? Nennen Sie Ziel, Indikationen und Kontraindikationen.",
  pts:["Anwendung der Basalen Stimulation, wahrnehmungsorientiert","Keine ärztliche Anordnung nötig","Ziel: gleichmäßige, ruhige, tiefe Atmung","Indikationen: flache/schnelle/unregelmäßige Atmung, Schmerz, Beatmungsentwöhnung, Beziehungsaufbau, Einschlafen","Kontraindikationen: offene/schmerzende Haut am Rücken, Rippenserienbruch, nach Thorax-OP"],
  a:"Die ASE ist eine Einreibung aus der Basalen Stimulation. Ich brauche dafür keine ärztliche Anordnung.\nDas Ziel ist eine gleichmäßige, ruhige und tiefe Atmung.\nIch setze sie ein bei flacher, schneller oder unregelmäßiger Atmung, bei Schmerzen, bei der Entwöhnung von der Beatmung, zur Beruhigung und zum Einschlafen. Sie hilft auch beim Beziehungsaufbau.\nIch mache keine ASE bei offener oder schmerzender Haut am Rücken, bei Rippenserienbrüchen und nach einer Operation am Thorax."},
 {id:"o_vf",t:3,ex:1,q:"Beschreiben Sie die Messung von Puls, Atmung und Blutdruck inklusive Fehlerquellen.",
  pts:["Puls: A. radialis, 3 Finger (nicht Daumen), 15 s × 4; bei Arrhythmie/Aufnahme 1 min; Frequenz, Rhythmus, Qualität","Atmung: unbemerkt, 1 min, Finger am Arm lassen","RR: Ruhe, Manschette 2/3 Oberarm, Herzhöhe, gleicher Arm/Position; Erstaufnahme beidseits","Kein RR an Arm mit Shunt, Lymphödem, Zugang, Verletzung","Fehler: Luft zu schnell ablassen, über Kleidung, falsche Größe, Lärm, Unruhe, Daumen","Dokumentation: Puls rot, RR als Zahl; Abweichungen melden"],
  a:"Den Puls taste ich an der Arteria radialis mit drei Fingern, nicht mit dem Daumen. Bei regelmäßigem Puls zähle ich 15 Sekunden mal 4, bei Rhythmusstörungen oder bei der Aufnahme eine ganze Minute. Ich beurteile Frequenz, Rhythmus und Qualität.\nDanach lasse ich die Finger liegen und zähle unbemerkt eine Minute die Atemzüge.\nFür den Blutdruck sitzt oder liegt die Person ruhig. Die Manschette bedeckt etwa zwei Drittel des Oberarms und ist auf Herzhöhe. Ich messe immer am gleichen Arm, bei der Aufnahme an beiden Armen. Nicht messen darf ich an einem Arm mit Shunt, Lymphödem oder Zugang.\nFehler sind zum Beispiel: Luft zu schnell ablassen, Messung über der Kleidung, falsche Manschettengröße oder Lärm.\nIch dokumentiere den Puls rot in der Fieberkurve, den Blutdruck als Zahl, und melde Abweichungen."},
 {id:"o_fieber",t:3,ex:1,q:"Was ist Fieber? Beschreiben Sie die Fieberphasen und passende Pflegemaßnahmen.",
  pts:["Fieber > 38,0 °C durch Sollwerterhöhung im Hypothalamus (Hyperthermie ohne Sollwerterhöhung)","Abwehrreaktion/Warnsignal","Fieberanstieg: Frösteln, Schüttelfrost → wärmen, warme Getränke","Fieberhöhe: Wadenwickel, Flüssigkeit, Vitalzeichen","Fieberabfall: Lysis (langsam) oder Krisis (schnell, Kreislauf!) → Kreislauf, Wäschewechsel","Ziele: Ursache erkennen, Komplikationen vermeiden, Wohlbefinden; Ältere: wenig Fieber, Durst ↓"],
  a:"Fieber ist eine Erhöhung der Körperkerntemperatur auf über 38,0 Grad. Der Sollwert im Hypothalamus ist erhöht. Fieber ist eine Abwehrreaktion und ein Warnsignal.\nIm Fieberanstieg friert die Person und hat Schüttelfrost. Ich wärme sie mit einer Decke und gebe warme Getränke.\nIn der Fieberhöhe ist die Haut heiß. Jetzt kann ich Wadenwickel machen, gebe viel zu trinken und kontrolliere die Vitalzeichen.\nIm Fieberabfall sinkt die Temperatur langsam (Lysis) oder schnell (Krisis). Bei der Krisis beobachte ich besonders den Kreislauf. Bei Schweiß wechsle ich die Wäsche.\nZiele sind: Ursache erkennen, Komplikationen vermeiden und das Wohlbefinden fördern."},
 {id:"o_atemnot",t:3,q:"Ein Patient hat plötzlich Atemnot. Woran erkennen Sie Dyspnoe und was tun Sie?",
  pts:["Dyspnoe = subjektives Gefühl der Atemnot","Zeichen: Kurzatmigkeit, nach Luft ringen, Unruhe/Angst, Atemgeräusche, Hilfsmuskulatur, Zyanose","Alarm/Hilfe holen, Arzt informieren","Beengende Kleidung + Fenster öffnen, nicht allein lassen, Ruhe","OK hoch (Herzinsuffizienz: Beine tief), Lippenbremse","O₂ nach ÄAO (Notfall kurzfristig ohne), Medikamente lt. AO, Bewusstsein + Vitalwerte, Dokumentation"],
  a:"Dyspnoe ist das subjektive Gefühl von Atemnot. Ich sehe Kurzatmigkeit, die Person ringt nach Luft, ist unruhig und hat Angst. Vielleicht höre ich Geräusche wie Giemen oder Rasseln, sie benutzt die Atemhilfsmuskulatur oder die Lippen sind blau.\nIch löse Alarm aus und hole Hilfe. Ich öffne beengende Kleidung und das Fenster und bleibe beim Patienten.\nIch lagere den Oberkörper hoch und leite zur Lippenbremse an.\nSauerstoff gebe ich nach ärztlicher Anordnung, im Notfall kurz auch ohne. Ich kontrolliere Bewusstsein und alle Vitalwerte und dokumentiere alles."},
 {id:"o_10r",t:4,ex:1,q:"Wie richten und verabreichen Sie Medikamente sicher? Nennen Sie die 10-R-Regel.",
  pts:["Schriftliche, eindeutige ärztliche Anordnung (Name, Geb.-Datum, Präparat, Form, Dosis, Zeit)","Händedesinfektion, saubere Arbeitsfläche, nicht mit Hand berühren","3× kontrollieren: Herausnehmen, Entnahme, Zurückstellen; 4-Augen-Prinzip","10 R: Person, Medikament, Dosierung, Applikationsform, Zeitpunkt, Anwendungsdauer, Aufbewahrung, Risikomanagement, Dokumentation, Entsorgung","Einnahme kontrollieren, Nebenwirkungen beobachten","Fehler sofort melden"],
  a:"Ich richte nur nach einer schriftlichen und eindeutigen ärztlichen Anordnung mit Name, Geburtsdatum, Medikament, Form, Dosis und Zeit.\nVorher desinfiziere ich die Hände und arbeite auf einer sauberen Fläche. Ich berühre die Tabletten nicht mit der Hand.\nIch kontrolliere das Medikament dreimal: beim Herausnehmen, bei der Entnahme und beim Zurückstellen. Wir arbeiten nach dem 4-Augen-Prinzip.\nDie 10-R-Regel heißt: richtige Person, richtiges Medikament, richtige Dosierung, richtige Applikationsform, richtiger Zeitpunkt, richtige Anwendungsdauer, richtige Aufbewahrung, richtiges Risikomanagement, richtige Dokumentation und richtige Entsorgung.\nBei der Gabe kontrolliere ich die Einnahme und beobachte Nebenwirkungen. Einen Fehler melde ich sofort."},
 {id:"o_nsv",t:4,q:"Sie haben sich mit einer gebrauchten Nadel gestochen. Was tun Sie? Wie verhindern Sie das?",
  pts:["Wunde gut auspressen","Ausgiebig desinfizieren; Schleimhaut/Auge spülen","Patientendaten und Serologie, Blutabnahme veranlassen","Meldung (Arbeitsmedizin; Praktikum AUVA + FH), Dokumentationsprotokoll","Gefahr Hepatitis B/C, HIV","Prävention: kein Recapping, sofort in stichfesten Behälter vor Ort"],
  a:"Ich drücke die Wunde gut aus und desinfiziere sie ausgiebig. Wenn die Schleimhaut oder das Auge betroffen ist, spüle ich.\nDann werden die Daten des Patienten und die Serologie erhoben und Blut abgenommen.\nIch melde den Unfall, im Praktikum an die AUVA und an die FH, und fülle das Protokoll aus. Es besteht Gefahr für Hepatitis B, C oder HIV.\nUm das zu verhindern, mache ich kein Recapping und werfe Nadeln sofort in einen stichfesten Behälter."},
 {id:"o_sinne",t:4,q:"Wie gehen Sie mit seh- und hörbeeinträchtigten Patient:innen um?",
  pts:["Sehen: anklopfen, Verlassen ankündigen, mit Namen ansprechen, eigenen Namen nennen","Sehen: Gegenstände immer am gleichen Platz, Türen schließen, normale Lautstärke, über Maßnahmen informieren","Führen: Richtungswechsel ankündigen, Hindernisse, Stuhl ertasten lassen","Hören: Blickkontakt, Mund nicht verdecken, langsam/deutlich, nicht lauter","Hören: kurze Sätze, Mimik/Gestik, aufschreiben, mehr Zeit","Hörgerät: Batterie, Ohrpassstück, kein Wasser/Hitze/Chemikalien"],
  a:"Bei sehbeeinträchtigten Menschen klopfe ich an und sage, wer ich bin. Ich spreche die Person mit Namen an und sage auch, wenn ich gehe. Ich spreche normal laut.\nDinge bleiben immer am gleichen Platz und die Türen schließe ich, damit sie sich nicht verletzt. Vor jeder Maßnahme erkläre ich, was ich mache. Beim Gehen sage ich Richtungswechsel und Hindernisse an.\nBei hörbeeinträchtigten Menschen halte ich Blickkontakt und verdecke meinen Mund nicht. Ich spreche langsam und deutlich, aber nicht lauter, in kurzen Sätzen. Wenn nötig schreibe ich es auf.\nBeim Hörgerät prüfe ich Batterie und Ohrpassstück und schütze es vor Wasser und Hitze."},
 {id:"o_fbm",t:4,q:"Was gilt laut Sturzleitlinie für freiheitsbeschränkende Maßnahmen und Sturzprävention?",
  pts:["Sturz = unbeabsichtigt auf Boden/tiefere Ebene","FbM senken das Sturzrisiko nicht, können schaden","Nur Einzelfall, gelindestes Mittel, Anordnung Arzt/DGKP, dokumentieren, evaluieren, mit Angehörigen besprechen (HeimAufG/UbG)","Gelindere Mittel zuerst, z. B. Alarmsysteme","Umgebung: Bett niedrig, Rufglocke/Brille/Gehhilfe in Reichweite, trockener Boden, Licht","Gute Schuhe statt Antirutschsocken; Medikamentenreview"],
  a:"Ein Sturz ist ein Ereignis, bei dem eine Person unbeabsichtigt auf dem Boden oder einer tieferen Ebene liegt.\nFreiheitsbeschränkende Maßnahmen wie Bettgitter oder Gurte verhindern Stürze nicht und können schaden. Man setzt sie nur im Einzelfall ein, immer das gelindeste Mittel. Sie müssen von einem Arzt oder einer DGKP angeordnet, dokumentiert und regelmäßig überprüft werden. In Österreich regelt das das Heimaufenthaltsgesetz.\nZuerst nutze ich gelindere Mittel, zum Beispiel einen Bettsensor.\nZur Sturzprävention stelle ich das Bett niedrig, lege Rufglocke, Brille und Gehhilfe in Reichweite, halte den Boden trocken, sorge für Licht und achte auf feste Schuhe."},
 {id:"o_intim",t:5,ex:1,q:"Wie wahren Sie Intimsphäre und Würde bei der Körperpflege? Gehen Sie auf Scham und Ekel ein.",
  pts:["Distanzzonen; professionelle Beziehung (Sie + Nachname)","Anklopfen, Sichtschutz, Mitpatient:innen hinausbitten, nur nötige Teile aufdecken","Zustimmung einholen, Schritte erklären","Individualität: Gewohnheiten, eigene Produkte/Kleidung, Ressourcen fördern","Scham ernst nehmen (ignoriert → Angst, Aggression, Schmerz); Wunsch nach gleichgeschlechtlicher Pflegeperson","Ekel: im Team ansprechen, Pausen, Schutzmaßnahmen"],
  a:"Ich achte die Distanzzonen und spreche die Person mit „Sie“ und Nachnamen an.\nIch klopfe an, verwende einen Sichtschutz und bitte mobile Mitpatienten, kurz hinauszugehen. Ich decke nur den Körperteil auf, den ich gerade wasche.\nIch erkläre jeden Schritt und hole die Zustimmung ein. Ich frage nach Gewohnheiten und verwende gerne eigene Produkte. Die Person macht so viel wie möglich selbst.\nScham nehme ich ernst, sonst können Angst oder Aggression entstehen. Viele Frauen wünschen sich eine weibliche Pflegeperson.\nWenn ich Ekel fühle, spreche ich im Team darüber, mache kurze Pausen und trage Schutzkleidung."},
 {id:"o_gkw",t:5,ex:1,q:"Beschreiben Sie die Ganzkörperwaschung im Bett (Vorbereitung, Durchführung, Nachbereitung).",
  pts:["Vorbereitung: Fenster/Türen zu, Händedesinfektion, ggf. Schürze, Material, Information, Wünsche","Durchführung: Augen außen → innen, nur nötige Teile aufdecken, Ressourcen nutzen","Hautfalten gut trocknen, Haut beobachten (Farbe, Temperatur, Turgor, Intertrigo)","Hautreinigung pH-neutral, Wasser nicht zu heiß; Hautpflege nach Hauttyp","Intimpflege unter Wahrung der Intimsphäre","Nachbereitung: Material, Wäsche, Händedesinfektion, Evaluation, Dokumentation"],
  a:"Zur Vorbereitung schließe ich Fenster und Türen, desinfiziere die Hände, ziehe wenn nötig eine Schürze an und richte alles Material. Ich informiere die Person und frage nach ihren Wünschen.\nIch wasche das Gesicht und reinige die Augen von außen nach innen. Ich decke nur den Teil auf, den ich gerade wasche. Die Person hilft mit, so viel sie kann.\nDie Hautfalten trockne ich gut ab und beobachte die Haut. Ich nehme pH-neutrale Produkte und nicht zu heißes Wasser und pflege die Haut nach dem Hauttyp.\nBei der Intimpflege achte ich besonders auf die Intimsphäre.\nDanach räume ich auf, entsorge die Wäsche, desinfiziere die Hände, evaluiere und dokumentiere."},
 {id:"o_mund",t:5,q:"Wie führen Sie Mundpflege durch? Erklären Sie Soor- und Parotitisprophylaxe.",
  pts:["Ziele: Reinigung, Schleimhaut feucht, Infektionen vermeiden; Goldstandard Zähneputzen","Beobachtung: Schleimhaut rosa/feucht, Zunge belagfrei, Lippen ohne Risse","Prothese: mechanisch + chemisch, nachts trocken","Bewusstseins-/Schluckstörung: keine Flüssigkeit in den Mund (Aspiration)","Soor: Mundhöhle inspizieren, 2× tgl. Mundpflege, feucht halten, trinken","Parotitis: Speichelfluss anregen – kauen, saure Bonbons, Eiswürfel, Massage, trinken"],
  a:"Mundpflege soll den Mund reinigen, die Schleimhaut feucht halten und Infektionen verhindern. Am wichtigsten ist das Zähneputzen.\nIch beobachte: Die Schleimhaut soll rosa und feucht sein, die Zunge ohne Belag, die Lippen ohne Risse.\nDie Zahnprothese reinige ich mit Bürste und Reinigungslösung. In der Nacht liegt sie trocken in der Schale.\nBei Bewusstseins- oder Schluckstörungen gebe ich keine Flüssigkeit in den Mund – Aspirationsgefahr.\nSoorprophylaxe: Ich schaue täglich in den Mund, mache zweimal Mundpflege und halte die Schleimhaut feucht.\nParotitisprophylaxe: Ich rege den Speichelfluss an, zum Beispiel mit Kaugummi, sauren Bonbons, Eiswürfeln, Massage und viel Trinken."},
 {id:"o_thrombo",t:5,ex:1,q:"Was ist eine Thrombose? Wie erkennen Sie sie und welche Prophylaxe führen Sie durch?",
  pts:["Thrombose = Verengung/Verschluss eines Gefäßes durch Blutgerinnsel; häufig TVT","Virchow-Trias: Strömung ↓, Wandschaden, Gerinnung ↑","Zeichen: Druckschmerz, Schwellung, Rötung/livide, Überwärmung; Lungenembolie: Atemnot, Brustschmerz, Puls ↑ → Arzt, nicht mobilisieren","Risiko niedrig → Basis; mittel/hoch → + Medikamente","Basis: Frühmobilisation (Muskel-Venen-Pumpe), Bewegungsübungen, Flüssigkeit","MTS lt. AA: 15–20 min liegen, messen, faltenfrei, Zehen kontrollieren; Nutzen umstritten (GAPS)"],
  a:"Eine Thrombose ist ein Blutgerinnsel, das ein Gefäß verengt oder verschließt. Am häufigsten ist die tiefe Beinvenenthrombose.\nNach der Virchow-Trias entsteht sie durch langsamen Blutfluss, Schäden an der Gefäßwand und erhöhte Gerinnung.\nZeichen sind Druckschmerz in der Wade, Schwellung, Rötung oder blaue Farbe und ein warmes Bein. Bei Atemnot und Brustschmerz denke ich an eine Lungenembolie. Dann rufe ich sofort den Arzt und mobilisiere nicht.\nZur Prophylaxe mobilisiere ich früh, damit die Muskel-Venen-Pumpe arbeitet, leite Bewegungsübungen an und achte auf genug Flüssigkeit. Bei mittlerem und hohem Risiko kommen Medikamente dazu.\nThrombosestrümpfe ziehe ich nach Anordnung an: nach 15 bis 20 Minuten Liegen, gut ausgemessen und ohne Falten."},
 {id:"o_intertrigo",t:5,q:"Was ist Intertrigo und wie beugen Sie vor?",
  pts:["Oberflächliche Hautentzündung in Hautfalten durch Feuchtigkeit, Wärme, Verunreinigung","DD: IAD (Harn/Stuhl)","3× tgl. beobachten","2× tgl. mit klarem Wasser waschen, trocken tupfen","Hautschutz, fusselfreie Kompressen/Leinen faltenfrei einlegen","Schwitzen ↓; Pilz → Antimykotikum lt. AA"],
  a:"Intertrigo ist eine oberflächliche Entzündung der Haut in Hautfalten. Sie entsteht durch Feuchtigkeit, Wärme und Schmutz. Ich muss sie von der inkontinenzassoziierten Dermatitis unterscheiden.\nIch beobachte die gefährdeten Stellen dreimal am Tag und wasche sie zweimal am Tag mit klarem Wasser. Danach tupfe ich sie gut trocken.\nIch verwende Hautschutz und lege fusselfreie Kompressen oder Leinenstreifen ohne Falten in die Hautfalte. Ich versuche, Schwitzen zu vermeiden. Bei Pilz gibt der Arzt ein Antimykotikum."},
 {id:"o_asp",t:6,ex:1,q:"Was versteht man unter Aspirationsprophylaxe? Nennen Sie Risikofaktoren und Maßnahmen.",
  pts:["Maßnahmen gegen Eindringen von Nahrung/Fremdkörpern in die Trachea; Folge Pneumonie","Risiko: Dysphagie, Erbrechen, nach Intubation, Neurologie, Desorientierung, falsche Position, Zahnprothese, Frühgeborene","OK hoch während und nach dem Essen, am Tisch bevorzugen","Dabeibleiben, Zeit, Mund leer vor nächstem Bissen, Konsistenzen nicht mischen","Konsistenz anpassen, eindicken (IDDSI), Prothese prüfen, Mundhygiene danach","Bei Aspiration: vorbeugen, husten, Heimlich, SpO₂, Arzt"],
  a:"Aspirationsprophylaxe sind alle Maßnahmen, damit keine Nahrung oder Fremdkörper in die Luftröhre kommen. Eine Folge der Aspiration ist eine Lungenentzündung.\nRisikofaktoren sind Schluckstörungen, Erbrechen, Zustand nach Intubation, neurologische Erkrankungen, Desorientierung, eine falsche Sitzposition oder eine schlechte Zahnprothese.\nDie Person sitzt beim Essen und danach mit erhöhtem Oberkörper, am besten am Tisch. Ich bleibe dabei und gebe genug Zeit. Der Mund muss leer sein, bevor ich nachgebe. Ich mische keine Konsistenzen und dicke Getränke wenn nötig ein.\nNach dem Essen mache ich Mundpflege.\nWenn sich die Person verschluckt, beugt sie sich vor und hustet. Wenn nötig, mache ich den Heimlich-Handgriff, messe die Sättigung und informiere den Arzt."},
 {id:"o_dehyd",t:6,q:"Woran erkennen Sie eine Dehydratation und wie beugen Sie vor?",
  pts:["Dehydratation = Wasserverlust (akut); Exsikkose = Folge, Elektrolyte, Schock","Risiko: alte Menschen (Durst ↓), Säuglinge, Diuretika, Fieber, Diarrhoe, Schluckstörung","Zeichen: Durst, trockene Zunge, kein Speichelsee, stehende Hautfalte","Urin ↓/konzentriert, Tachykardie, Hypotonie, Verwirrtheit, eingesunkene Fontanelle","Maßnahmen: Lieblingsgetränk, Rituale, Hilfsmittel, Trinkprotokoll, Bilanz","Ärztliche Trinkmengenbeschränkung beachten"],
  a:"Dehydratation ist ein akuter Wasserverlust. Die Folge kann eine Exsikkose sein, mit Elektrolytstörung und Schockgefahr.\nBesonders gefährdet sind alte Menschen, weil sie weniger Durst haben, Säuglinge und Menschen mit Fieber, Durchfall oder Diuretika.\nIch erkenne sie an Durst, trockener Zunge, fehlendem Speichelsee, einer stehenden Hautfalte, wenig dunklem Urin, schnellem Puls und niedrigem Blutdruck. Die Person kann verwirrt sein.\nIch biete das Lieblingsgetränk an, führe Trinkrituale ein und benutze Hilfsmittel wie einen Schnabelbecher. Ich führe ein Trinkprotokoll oder eine Bilanz. Eine ärztliche Trinkmengenbeschränkung beachte ich."},
 {id:"o_bvwk",t:6,ex:1,q:"Worauf achten Sie bei Patient:innen mit liegendem Blasenverweilkatheter?",
  pts:["Geschlossenes System – nicht diskonnektieren","Beutel immer unter Blasenniveau, Schlauch ohne Knick","Entleeren je nach Diurese 1–2× tgl.; Flächendesinfektion am Ablass","Pflege mit Schleimhautdesinfektionsmittel","Probe: steriler Katheterurin über Membran mit Hautdesinfektion; Beutel nur für 24-h-Urin","Kontrolle: Durchgängigkeit, Menge, Farbe, Beimengungen; ausreichend trinken"],
  a:"Der Katheter ist ein geschlossenes System. Ich trenne ihn nicht vom Beutel.\nDer Beutel hängt immer unter dem Niveau der Blase, und der Schlauch hat keinen Knick.\nIch entleere den Beutel je nach Urinmenge ein- bis zweimal am Tag und desinfiziere den Ablass.\nFür die Katheterpflege verwende ich ein Schleimhautdesinfektionsmittel.\nEine Urinprobe entnehme ich steril an der Membran nach Hautdesinfektion. Nur für den 24-Stunden-Urin darf ich Urin aus dem Beutel nehmen.\nIch kontrolliere Durchgängigkeit, Menge, Farbe und Beimengungen. Die Person soll genug trinken."},
 {id:"o_inko",t:6,q:"Nennen Sie die Formen der Harninkontinenz und pflegerische Maßnahmen.",
  pts:["Belastungs-/Stressinkontinenz: Druckerhöhung (Husten), Verschlussstörung","Dranginkontinenz: imperativer Harndrang, Detrusor","Mischinkontinenz","Inkontinenz bei chronischer Harnretention: Restharn, Überlauf (Prostata)","Funktionelle: Toilette nicht rechtzeitig (Kognition/Mobilität)","Maßnahmen: Miktionsprotokoll, Blasen-/Toilettentraining, Beckenboden, Hilfsmittel, Hautpflege (IAD), Umgebung/Kleidung"],
  a:"Es gibt fünf Formen. Bei der Belastungsinkontinenz verliert die Person Urin beim Husten oder Heben, der Blasenverschluss ist gestört. Bei der Dranginkontinenz kommt ein plötzlicher, sehr starker Harndrang. Die Mischinkontinenz ist beides. Bei chronischer Harnretention bleibt Restharn in der Blase und sie läuft über, zum Beispiel bei einer großen Prostata. Bei der funktionellen Inkontinenz schafft es die Person nicht rechtzeitig zur Toilette, zum Beispiel wegen Demenz.\nIch führe ein Miktionsprotokoll. Beim Blasentraining werden die Abstände länger, beim Toilettentraining gehe ich mit der Person 15 Minuten vor der gewohnten Zeit zur Toilette. Dazu kommen Beckenbodentraining, passende Hilfsmittel, gute Hautpflege, eine gut erreichbare Toilette und einfache Kleidung."},
 {id:"o_obsti",t:6,q:"Wie beugen Sie einer Obstipation vor und wie verabreichen Sie ein Klistier?",
  pts:["Obstipation: erschwerte, verzögerte Entleerung, harter Stuhl","Prophylaxe: trinken, bewegen, Ballaststoffe, Sauermilch, feste Zeiten, Drang nicht unterdrücken, Sitzposition, Bauchmassage","Medikamente nur nach ÄAO, wenn andere Maßnahmen nicht helfen","Klistier: Linksseitenlage, Vaseline, 7–10 cm drehend einführen, unter Aufrollen einbringen","≥ 5 min halten, Rufglocke, Kreislauf/Sturz","Intimsphäre, Dokumentation"],
  a:"Bei einer Obstipation ist die Darmentleerung schwer und verzögert, der Stuhl ist hart.\nZur Vorbeugung soll die Person genug trinken, sich bewegen und ballaststoffreich essen. Feste Toilettenzeiten helfen, und den Stuhldrang soll man nie unterdrücken. Eine gute Sitzposition und eine Bauchmassage unterstützen.\nAbführmittel gibt es nur nach ärztlicher Anordnung, wenn das nicht hilft.\nFür ein Klistier liegt die Person auf der linken Seite mit angewinkelten Beinen. Ich mache die Spitze mit Vaseline gleitfähig und führe sie 7 bis 10 cm mit drehenden Bewegungen ein. Ich rolle das Klistier auf und ziehe es aufgerollt heraus. Die Person hält die Flüssigkeit mindestens 5 Minuten. Die Rufglocke liegt in Reichweite, und ich beobachte den Kreislauf."},
 {id:"o_essen",t:6,q:"Wie unterstützen Sie eine Patientin beim Essen und Trinken?",
  pts:["Essplatz vorbereiten: richtige Person, richtiges Essen, richtige Zeit; Atmosphäre","Sitzposition: OK hoch, am Tisch bevorzugen","Neben der Person sitzen, gemeinsam besprechen, Temperatur prüfen lassen","Besteck von vorne unten, Mund leer, Konsistenzen nicht mischen, Pausen, Serviette","Ressourcenorientiert; Hilfsmittel (gewinkeltes Besteck, Thermoteller, Nasenbecher)","Beobachten, Teller-/Trinkprotokoll, Mundpflege"],
  a:"Ich bereite den Essplatz schön vor und prüfe: Ist es die richtige Person, das richtige Essen und die richtige Zeit?\nDie Patientin sitzt aufrecht, am besten am Tisch, sonst mit erhöhtem Oberkörper im Bett.\nIch setze mich neben sie und wir besprechen, was sie zuerst essen möchte. Sie prüft die Temperatur.\nIch führe den Löffel von vorne unten zum Mund und warte, bis der Mund leer ist. Ich mische keine Konsistenzen und mache Pausen. Den Mund wische ich mit der Serviette ab.\nSie macht so viel wie möglich selbst, mit Hilfsmitteln wie gewinkeltem Besteck oder einem Becher mit Nasenausschnitt.\nIch führe ein Tellerprotokoll und mache danach Mundpflege."},
 {id:"o_sgl",t:7,ex:1,q:"Beschreiben Sie das Baden eines Säuglings.",
  pts:["Vorbereitung: Material, Raum warm, Wasser 36–38 °C, 10–15 cm (Herzfehler: Nabel)","Thermometer unter der Wasseroberfläche ablesen (Verbrühung, Bradykardie)","Genitalbereich vorher reinigen; Kind einfach ansprechen, ankündigen","Haltegriff: linker Oberarm in der Hand, Kopf auf Unterarm; Füße zuerst rein, Widerstand","Reihenfolge Kopf → Beine; Genital vom Schambein zum Anus; Vorhaut bis 3 J. nicht zurück","Füße zuletzt raus, einwickeln, von oben nach unten trocknen, nie unbeaufsichtigt"],
  a:"Ich richte alles Material, der Raum ist warm. Das Wasser hat 36 bis 38 Grad und ist 10 bis 15 cm hoch, bei einem Herzfehler nur bis zum Nabel. Ich lese das Thermometer unter der Wasseroberfläche ab.\nEinen schmutzigen Windelbereich reinige ich vorher. Ich spreche mit dem Baby und sage, was ich mache.\nMeine linke Hand hält den linken Oberarm, der Kopf liegt auf meinem Unterarm. Die Füße kommen zuerst ins Wasser und spüren einen Widerstand.\nIch wasche Kopf, Hals, Arme, Oberkörper, Bauch und Beine. Den Genitalbereich reinige ich vom Schambein zum Anus.\nDie Füße verlassen das Wasser zuletzt. Ich wickle das Baby ins Badetuch und trockne es von oben nach unten ab."},
 {id:"o_sglvital",t:7,q:"Was ist bei Vitalzeichen und Temperatur beim Säugling anders als beim Erwachsenen?",
  pts:["Je jünger: RR niedriger, Puls und AF höher","Puls: nicht radial/carotis – Fontanelle, A. brachialis, A. temporalis oder Auskultation","AF: 1 min in Ruhe/Schlaf, Hand unter Schwertfortsatz","RR: größere Manschette wählen, oszillometrisch","Temperatur rektal (Vaseline, Oberschenkel fixieren); Ohr beim Säugling unzuverlässig","Wärmeregulation: kein Zittern, braunes Fett, große Oberfläche → schneller Wärmeverlust; Eltern einbinden"],
  a:"Je jünger das Kind ist, desto niedriger ist der Blutdruck und desto höher sind Puls und Atemfrequenz.\nDen Puls taste ich nicht an der Radialis, sondern an der Fontanelle, an der Arteria brachialis oder temporalis, oder ich höre mit dem Stethoskop.\nDie Atmung zähle ich eine Minute, wenn das Kind ruhig ist oder schläft.\nBeim Blutdruck nehme ich im Zweifel die größere Manschette.\nDie Temperatur messe ich rektal mit Vaseline und halte den Oberschenkel fest. Das Ohrthermometer ist beim Säugling nicht so genau.\nSäuglinge können nicht zittern und verlieren schnell Wärme. Die Eltern binde ich ein, das beruhigt das Kind."},
 {id:"o_beikost",t:7,q:"Wie wird ein Säugling im 1. Lebensjahr ernährt? Gehen Sie auf Muttermilch, Industrienahrung und Beikost ein.",
  pts:["Muttermilch: Kolostrum → Übergangsmilch → reife Milch; Vorteile Kind/Mutter","Lagerung MM: Raum 2–4 h, Kühlschrank 3 Tage, Gefrierer 6 Monate","Pre-Nahrung ganzes 1. Lj., ad libitum; 1er nicht ad libitum; Folgenahrung unnötig; HA bei Allergierisiko","Beikost nicht vor 17. und nicht nach 26. Woche; Zeichen der Bereitschaft","Allergene nicht meiden; Vit. D 400 IE; Eisen (Fleisch, Getreide + Vit. C); wenig Kuhmilch","Fläschchen 37 °C, steil halten, aufstoßen, dokumentieren"],
  a:"Am besten ist Muttermilch. Zuerst gibt es Kolostrum mit vielen Abwehrstoffen, dann Übergangsmilch und nach 2 bis 3 Wochen reife Muttermilch. Abgepumpte Milch hält bei Raumtemperatur 2 bis 4 Stunden, im Kühlschrank 3 Tage und im Gefrierschrank 6 Monate.\nWenn nicht gestillt wird, ist Pre-Nahrung im ganzen ersten Jahr gut. Man kann sie nach Bedarf geben. Folgenahrung ist nicht nötig.\nMit Beikost beginnt man nicht vor der 17. und nicht nach der 26. Woche, wenn das Kind mit wenig Hilfe sitzt und Interesse zeigt. Allergene wie Ei oder Fisch soll man nicht meiden.\nDas Kind bekommt täglich 400 IE Vitamin D. Eisen kommt aus Fleisch oder aus Getreide mit Obst.\nDas Fläschchen hat 37 Grad, ich halte es steil und lasse das Kind aufstoßen."},
 {id:"o_windel",t:7,q:"Was ist eine Windeldermatitis und wie wird sie behandelt?",
  pts:["Überbegriff, meist irritative Kontaktdermatitis durch Urin/Stuhl (Barrierestörung); bei Erwachsenen IAD","Symptome: Rötung, Nässe, ggf. Pusteln, Juckreiz, Brennen","Risiko: Stuhlfrequenz ↑, seltenes Wickeln, Beikostbeginn, Antibiotika, Soor","ABCDE: Air, Barrier, Clean, Diapers, Education","Häufig wickeln (~2 h, nach Stuhl), sanft tupfen mit lauwarmem Wasser/Öl, Zink-/Panthenolcreme","Candida → Antimykotikum lt. AO; Textilien einmal, ≥ 60 °C"],
  a:"Die Windeldermatitis ist meistens eine Reizung der Haut durch Urin und Stuhl. Bei Erwachsenen sagt man inkontinenzassoziierte Dermatitis.\nDie Haut ist rot und nass, manchmal mit Pusteln, und sie juckt und brennt.\nRisiken sind viel Stuhl, seltenes Wickeln, der Beginn der Beikost, Antibiotika und Soor.\nIch behandle nach ABCDE: Luft an die Haut, Hautschutz mit Paste, sanfte Reinigung, häufig Windeln wechseln und die Eltern beraten.\nIch wickle etwa alle 2 Stunden und nach jedem Stuhl, tupfe mit lauwarmem Wasser oder Öl und verwende Zinkcreme. Bei Pilz gibt es eine Salbe nach ärztlicher Anordnung."}
];

  app.querySelector("#qz").onclick=()=>{const p=B.filter(q=>S.sel.has(q.t));start(shuffle(p),"Üben")};
  app.querySelectorAll(".knav a").forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById(a.dataset.k);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})});
  if(jump){const el=document.getElementById(jump);if(el)requestAnimationFrame(()=>el.scrollIntoView({block:"start"}));}else window.scrollTo(0,0);
}

/* ---------- Praktische Skills ---------- */
let skDone=store.get("guk_sk",{});
const PRIO={3:"sehr wahrscheinlich",2:"wahrscheinlich",1:"möglich"};
const SK={last:null};
function skAsk(a,open){ const i=a.indexOf(" → "); const q=i<0?a:a.slice(0,i), ans=i<0?"":a.slice(i+3);
  return `<li><b>${esc(q)}</b>${ans?(open?`<span>${esc(ans)}</span>`:`<details><summary>Antwort zeigen</summary><span>${esc(ans)}</span></details>`):""}</li>`; }
function skCard(s){
  return `<details class="panel sk" data-id="${s.id}"><summary><span class="sk-t">${esc(s.title)}</span><span class="sk-p p${s.prio}">${PRIO[s.prio]}</span>${skDone[s.id]?'<span class="sk-ok">✓ sicher</span>':""}</summary>
  <div class="sk-b">
   <span class="label">Material</span><ul class="clist">${s.mat.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
   <span class="label">Ablauf</span><ol class="clist">${s.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
   <span class="label">Darauf achten Prüfer:innen</span><ul class="clist">${s.crit.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
   <span class="label">Mögliche Fragen danach</span><ul class="sk-ask">${s.ask.map(a=>skAsk(a,true)).join("")}</ul>
   ${s.gap?`<div class="note warn">⚠ ${esc(s.gap)}</div>`:""}
   ${s.tip?`<div class="sk-ru">${esc(s.tip)}</div>`:""}
   <span class="stats">Quelle: ${esc(s.src)}</span>
   <div class="row"><button class="btn sm ${skDone[s.id]?"ghost":""}" data-sk="${s.id}">${skDone[s.id]?"Wieder als unsicher":"Kann ich ✓"}</button><button class="btn ghost sm" data-sim="${s.id}">Diesen üben</button></div>
  </div></details>`; }
function skills(onlyOpen){
  hideSide();
  const list=SKILLS.filter(s=>!onlyOpen||!skDone[s.id]);
  const n=SKILLS.filter(s=>skDone[s.id]).length;
  const groups={}; list.slice().sort((x,y)=>y.prio-x.prio).forEach(s=>(groups[s.t]=groups[s.t]||[]).push(s));
  app.innerHTML=`
  <header class="head"><div class="status"><span class="dot"></span>Praxisteil · Demonstration + Fragen</div><h1><span class="x">Skills</span> für die Prüfung</h1>${ECG}
   <p class="sub">${SKILLS.length} Skills aus den Unterlagen, sortiert nach Wahrscheinlichkeit (eigene Einschätzung). ⚠ markiert, was so nicht in den Unterlagen steht.</p></header>
  <section class="panel"><div class="qhead"><h2>Simulation</h2><span class="stats">${n}/${SKILLS.length} sicher</span></div>
   <p class="sub">Zufälliger Skill wie am 19.11.: laut durchführen oder erklären, dann Schritte abhaken und die Prüferfragen beantworten.</p>
   <div class="row"><button class="btn" id="sk-sim">Zufalls-Skill ziehen</button><button class="btn ghost" id="sk-f">${onlyOpen?"Alle zeigen":"Nur unsichere ("+(SKILLS.length-n)+")"}</button></div></section>
  ${Object.keys(TOPICS).filter(t=>groups[t]).map(t=>`<h2>${esc(TOPICS[t])}</h2>${groups[t].map(skCard).join("")}`).join("")||`<section class="panel"><p class="sub">Alle Skills als sicher markiert ✓</p></section>`}`;
  app.querySelector("#sk-sim").onclick=()=>skSim();
  app.querySelector("#sk-f").onclick=()=>skills(!onlyOpen);
  app.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>{const id=b.dataset.sk; if(skDone[id])delete skDone[id]; else skDone[id]=1; store.set("guk_sk",skDone);
    const open=b.closest("details").dataset.id; skills(onlyOpen); const d=app.querySelector(`details[data-id="${open}"]`); if(d){d.open=true;}});
  app.querySelectorAll("[data-sim]").forEach(b=>b.onclick=()=>skSim(b.dataset.sim));
  window.scrollTo(0,0);
}
function skSim(id){
  hideSide();
  let s=id?SKILLS.find(x=>x.id===id):null;
  if(!s){ const pool=[]; SKILLS.forEach(x=>{for(let i=0;i<x.prio;i++)pool.push(x)});
    do{ s=pool[Math.floor(Math.random()*pool.length)]; }while(SKILLS.length>1&&s.id===SK.last); }
  SK.last=s.id; SK.s=s; SK.phase=0; SK.ck=new Set(); skSimView(); window.scrollTo(0,0);
}
function skSimView(){
  const s=SK.s, items=s.steps.concat(s.crit.map(c=>"Kriterium: "+c));
  app.innerHTML=`
  <div class="row" style="justify-content:space-between"><button class="btn ghost sm" id="back">← Skills</button><span class="stats">Prüfungssimulation</span></div>
  <section class="panel">
    <div class="qhead"><span class="type">Praktischer Skill</span><span class="label">${esc(TOPICS[s.t])}</span></div>
    <p class="q">${esc(s.title)}</p>
    <span class="label">Material bereitlegen</span><ul class="clist">${s.mat.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    ${SK.phase===0?`<p class="sub">Jetzt den Skill laut durchführen bzw. jeden Schritt aussprechen – inklusive Begründung. Danach vergleichen.</p>
    <div class="row"><button class="btn" id="sk-rev">Fertig – Ablauf zeigen</button></div>`:`
    <span class="label">Abhaken, was du gemacht und gesagt hast</span>
    <ul class="oq-pts">${items.map((p,i)=>`<li><label><input type="checkbox" data-i="${i}" ${SK.ck.has(i)?"checked":""}><span>${esc(p)}</span></label></li>`).join("")}</ul>
    <div class="stats" id="sksc">${SK.ck.size} / ${items.length} · ${Math.round(SK.ck.size/items.length*100)} %</div>
    <span class="label">Prüferfragen – erst selbst antworten</span><ul class="sk-ask">${s.ask.map(a=>skAsk(a,false)).join("")}</ul>
    ${s.gap?`<div class="note warn">⚠ ${esc(s.gap)}</div>`:""}
    <span class="stats">Quelle: ${esc(s.src)}</span>
    <div class="row"><button class="btn" id="sk-next">Nächster Skill</button><button class="btn ghost" id="sk-ok">${skDone[s.id]?"✓ sicher":"Kann ich ✓"}</button></div>`}
  </section>`;
  const $=x=>app.querySelector(x);
  $("#back").onclick=()=>skills();
  if($("#sk-rev"))$("#sk-rev").onclick=()=>{SK.phase=1;skSimView();};
  app.querySelectorAll(".oq-pts input").forEach(c=>c.onchange=()=>{const i=+c.dataset.i;c.checked?SK.ck.add(i):SK.ck.delete(i);
    $("#sksc").textContent=`${SK.ck.size} / ${items.length} · ${Math.round(SK.ck.size/items.length*100)} %`;});
  if($("#sk-next"))$("#sk-next").onclick=()=>skSim();
  if($("#sk-ok"))$("#sk-ok").onclick=()=>{skDone[s.id]=1;store.set("guk_sk",skDone);$("#sk-ok").textContent="✓ sicher";};
}
/* ---------- Tab-Leiste (One UI, Daumenbereich) ---------- */
function setTab(t){ document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===t?"page":"false")); }
[["home","home"],["checklists","seq"],["seqStart","seq"],["oqStart","open"],["konspekt","ksp"],["mtStart","home"],["start","home"],["skills","skills"],["skSim","skills"],["ranking","home"]]
  .forEach(([f,tab])=>{ const orig=window[f]; window[f]=function(){ setTab(tab); return orig.apply(this,arguments); }; });
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>{ const t=b.dataset.tab;
  if(t==="home")home(); else if(t==="skills")skills(); else if(t==="seq")checklists(); else if(t==="open")oqStart(OPEN.filter(o=>o.ex).concat(shuffle(OPEN.filter(o=>!o.ex)))); else konspekt(); });
tick();
home();
</script>

</body>
</html>
