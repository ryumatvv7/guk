<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="GuK 1 Prüfungstrainer – Gesundheits- und Krankenpflege 1">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GuK 1 Prüfungstrainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: AMOLED-black nursing HUD tuned for Samsung/One UI – thumb-reach bottom tab bar, 52px targets, panels with corner brackets; Fehleranalyse docks right on wide screens; clock above the tab bar. Based on: one column of med-response HUD panels with cut corners and corner brackets; Fehleranalyse docks right on wide screens; clock/timer bottom-right. Deliberately single dark theme (night-city medical HUD): black glass, mint-cyan signal colour, white type, red for errors. */
:root{
  --bg:#000000; --bg2:#02070d; --panel:rgba(6,18,23,.86); --panel-hi:rgba(10,32,38,.92);
  --ink:#e4f3f0; --muted:#7c9896; --qink:#ffffff;
  --line:rgba(76,180,255,.20); --line-strong:rgba(76,180,255,.55);
  --accent:#4cb4ff; --accent-ink:#00111f; --accent-soft:rgba(76,180,255,.09); --glow:rgba(76,180,255,.35);
  --ok:#7dffb0; --ok-soft:rgba(125,255,176,.10); --bad:#ff3358; --bad-soft:rgba(255,51,88,.12); --bad-line:rgba(255,51,88,.55);
  --warn:#ffd23f; --hudbg:rgba(2,9,11,.88); --grid:rgba(76,180,255,.035);
  --f-display:"Chakra Petch","Exo 2","Segoe UI",sans-serif;
  --f-body:"Exo 2","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --cut:12px; --cut-s:7px; --gap:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;font-weight:500;line-height:1.45;min-height:100%;
  background-image:
    radial-gradient(ellipse 80% 45% at 50% -10%, rgba(76,180,255,.13), transparent 70%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(180deg,var(--bg2),var(--bg) 55%);
  background-size:auto,44px 44px,44px 44px,auto;
  background-attachment:fixed;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 170px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
::selection{background:var(--accent);color:var(--accent-ink)}
.layout{display:grid;gap:20px;max-width:1220px;margin:0 auto;align-items:start}
.wrap{width:100%;max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);min-width:0}
@media (min-width:1100px){
  .layout.has-side{grid-template-columns:minmax(0,700px) minmax(0,440px);justify-content:center}
  .layout.has-side .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);max-height:calc(100vh - 120px);overflow:auto}
}
/* header */
.head{display:flex;flex-direction:column;gap:8px;padding-bottom:2px}
.status{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.status .dot{width:8px;height:8px;background:var(--accent);box-shadow:0 0 8px var(--glow);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7vw,48px);line-height:.98;margin:0;text-transform:uppercase;letter-spacing:.03em;color:var(--qink);text-wrap:balance}
h1 .x{color:var(--accent);text-shadow:0 0 14px var(--glow)}
h2{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0;text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}
h2::before{content:"// ";opacity:.55}
h3{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0;color:var(--qink);letter-spacing:.02em}
.sub{color:var(--muted);margin:0;max-width:60ch}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);opacity:.8}
.ecg{display:block;width:100%;height:auto;max-height:44px;overflow:visible}
.ecg path{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round;filter:drop-shadow(0 0 3px var(--glow))}
.ecg .base{stroke:var(--line);filter:none}
.ecg .trace{stroke-dasharray:130 1000;animation:trace 2.4s linear infinite}
@keyframes trace{from{stroke-dashoffset:130}to{stroke-dashoffset:-1000}}
/* panels: hairline border + corner brackets */
.panel{position:relative;border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:var(--gap);min-width:0;
  background:
    linear-gradient(var(--accent),var(--accent)) top left/16px 2px no-repeat,
    linear-gradient(var(--accent),var(--accent)) top left/2px 16px no-repeat,
    linear-gradient(var(--accent),var(--accent)) bottom right/16px 2px no-repeat,
    linear-gradient(var(--accent),var(--accent)) bottom right/2px 16px no-repeat,
    var(--panel)}
.panel.resume{border-color:var(--line-strong);box-shadow:0 0 0 1px var(--accent-soft),0 0 24px -8px var(--glow)}
.panel.missing{border-color:rgba(255,210,63,.4)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-family:var(--f-display);font-size:14.5px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 11px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-transform:uppercase;letter-spacing:.05em;text-align:left;
  clip-path:polygon(var(--cut-s) 0,100% 0,100% calc(100% - var(--cut-s)),calc(100% - var(--cut-s)) 100%,0 100%,0 var(--cut-s))}
.chip .n{font-family:var(--f-mono);font-size:11.5px;white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--line-strong);color:var(--accent)}
.chip:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.tight{gap:6px}
.btn{font:inherit;font-family:var(--f-display);font-weight:700;font-size:15.5px;text-transform:uppercase;letter-spacing:.12em;padding:11px 22px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;
  clip-path:polygon(var(--cut-s) 0,100% 0,100% calc(100% - var(--cut-s)),calc(100% - var(--cut-s)) 100%,0 100%,0 var(--cut-s))}
.btn.ghost{background:var(--accent-soft);color:var(--accent);border-color:var(--line-strong)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.3;cursor:default}
.btn:focus-visible,.chip:focus-visible,.mode:focus-visible,.cell:focus-visible,.counter:focus-visible,.step:focus-visible,.opt:has(input:focus-visible){outline:2px solid var(--warn);outline-offset:2px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{font:inherit;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:14px 16px 14px 18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.mode::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;background:var(--line-strong)}
.mode b{font-family:var(--f-display);font-size:18.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--qink);overflow-wrap:anywhere;hyphens:auto}
.mode span{color:var(--muted);font-size:14.5px;line-height:1.35}
.mode.hot{border-color:var(--bad-line);background:linear-gradient(135deg,rgba(255,51,88,.14),var(--panel) 60%)}
.mode.hot::before{background:var(--bad)}
.mode.hot b{color:#ffd9e0}
.mode:disabled{opacity:.32;cursor:default}
.bar{height:6px;overflow:hidden;background:repeating-linear-gradient(90deg, rgba(76,180,255,.14) 0 6px, transparent 6px 9px)}
.bar i{display:block;height:100%;width:0;transition:width .25s;background:repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 9px);filter:drop-shadow(0 0 4px var(--glow))}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.type{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--line-strong);color:var(--accent);background:var(--accent-soft)}
.type.mc{border-color:rgba(255,210,63,.6);color:var(--warn);background:rgba(255,210,63,.08)}
.q{font-size:20.5px;font-weight:600;margin:0;text-wrap:pretty;color:var(--qink);overflow-wrap:anywhere}
.q .neg{color:var(--warn);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);padding:11px 13px;cursor:pointer;background:rgba(0,0,0,.35);-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
.opt input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:#ff8ea2;box-shadow:inset 3px 0 0 var(--bad)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt .tag{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding-top:4px}
@media (hover:hover){
  .chip:hover:not(:disabled){border-color:var(--line-strong);color:var(--ink)}
  .mode:hover:not(:disabled){border-color:var(--line-strong);background:var(--panel-hi)}
  .mode.hot:hover:not(:disabled){border-color:var(--bad)}
  .opt:hover:not(.sel):not(.right):not(.wrong){border-color:var(--line-strong)}
  .btn:hover:not(:disabled){filter:brightness(1.12)}
  .step:hover:not(:disabled){border-color:var(--line-strong)}
}
.verdict{padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-left:3px solid}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)}
.verdict.bad{background:var(--bad-soft);border-color:var(--bad)}
.verdict strong{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.14em}
.verdict.ok strong{color:var(--ok)} .verdict.bad strong{color:var(--bad)}
.score{font-family:var(--f-display);font-weight:700;font-size:68px;line-height:.9;color:var(--qink);font-variant-numeric:tabular-nums;text-shadow:0 0 18px var(--glow)}
.score .of{font-size:28px;color:var(--muted);text-shadow:none}
.pill{display:inline-block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 12px;border:1px solid}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)} .pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.wrongs{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.wrongs li{border-left:3px solid var(--bad);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.wrongs .a{color:var(--muted);font-size:15.5px}
.wrongs .a.mine{color:#ff8ea2}
.wrongs .a.ex{font-size:14.5px}
.stats{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);letter-spacing:.02em}
/* Fehleranalyse: red alert variant */
.side{border:1px solid var(--bad-line);padding:18px;display:flex;flex-direction:column;gap:var(--gap);min-width:0;
  background:
    linear-gradient(var(--bad),var(--bad)) top left/16px 2px no-repeat,
    linear-gradient(var(--bad),var(--bad)) top left/2px 16px no-repeat,
    linear-gradient(var(--bad),var(--bad)) bottom right/16px 2px no-repeat,
    linear-gradient(var(--bad),var(--bad)) bottom right/2px 16px no-repeat,
    linear-gradient(180deg,rgba(255,51,88,.08),transparent 120px),
    var(--panel)}
.side h2{color:var(--bad)}
.side .sec{display:flex;flex-direction:column;gap:8px}
.ana{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ana li{border-left:3px solid var(--line);padding:4px 0 4px 10px;font-size:15.5px;overflow-wrap:anywhere}
.ana li.must{border-color:var(--ok)}
.ana li.err{background:var(--bad-soft)}
.ana .st{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.ana li.err .st{color:var(--bad)}
.key{font-size:15.5px;border-left:3px solid var(--accent);padding:6px 10px;background:var(--accent-soft)}
.key.warnkey{border-color:var(--bad);background:var(--bad-soft)}
.key b{color:var(--bad)}
.ai{font-size:16px;line-height:1.55;display:flex;flex-direction:column;gap:6px}
.ai p{margin:0}
.ai .li{padding-left:14px;text-indent:-12px}
.ai b{color:var(--accent);font-weight:700}
.ai .wait{font-family:var(--f-mono);color:var(--muted);letter-spacing:.06em;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.side .btn{padding:8px 14px;font-size:13.5px}
/* bottom-right readout */
.hud{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:20;pointer-events:none}
.hud-box{background:var(--hudbg);border:1px solid var(--line-strong);padding:6px 12px;display:flex;align-items:baseline;gap:8px;backdrop-filter:blur(4px);
  clip-path:polygon(var(--cut-s) 0,100% 0,100% calc(100% - var(--cut-s)),calc(100% - var(--cut-s)) 100%,0 100%,0 var(--cut-s))}
.hud-l{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#clock,#timer{font-family:var(--f-mono);font-weight:700;font-size:21px;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.04em;text-shadow:0 0 8px var(--glow)}
.hud-box.low{border-color:var(--bad)} .hud-box.low #timer{color:var(--bad);text-shadow:0 0 8px rgba(255,51,88,.5)}
.hud-box.sig .tag{font-family:var(--f-mono);font-size:13px;color:var(--qink);letter-spacing:.03em}
[hidden]{display:none!important}
.navbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.navbar .btn.sm{font-size:20px;line-height:1;padding:6px 16px}
.counter{font:inherit;font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:8px 10px;cursor:pointer;text-align:center}
.counter b{color:var(--qink);font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.02em}
.counter .caret{color:var(--accent);margin-left:4px}
.gridp{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;max-height:260px;overflow:auto}
.cell{font:inherit;font-family:var(--f-mono);font-size:12.5px;height:34px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.ans{background:var(--accent-soft);border-color:var(--line-strong);color:var(--accent)}
.cell.cur{outline:2px solid var(--qink);outline-offset:1px;color:var(--qink)}
.legend{gap:14px;font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i.cell{width:14px;height:14px;display:inline-block;cursor:default}
.cfg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* Abläufe */
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.mt-pool,.mt-bin .drop{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border:1px dashed var(--line);background:rgba(0,0,0,.25)}
.mt-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.mt-bin{min-width:0}.mt-bin h4{margin:0 0 6px;overflow-wrap:anywhere;font-family:var(--f-mono);font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.mt-bin.over .drop,.mt-pool.over{border-color:var(--accent);background:rgba(0,240,255,.08)}
.chipd{font:inherit;font-size:15px;padding:8px 11px;border:1px solid var(--line);background:rgba(0,0,0,.5);color:var(--ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;text-align:left}
.chipd.sel{outline:2px solid var(--accent)}
.chipd.right{border-color:#3ddc84;color:#3ddc84}.chipd.wrong{border-color:#ff4d6d;color:#ff4d6d}
.chipd.ghost{position:fixed;pointer-events:none;z-index:999;opacity:.9;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.chipd .fix{display:block;font-size:12px;opacity:.85}
.oq-ta{width:100%;min-height:180px;font:inherit;font-size:16px;line-height:1.5;background:rgba(0,0,0,.4);color:var(--ink);border:1px solid var(--line);padding:10px 12px;resize:vertical}
.oq-ta:focus{outline:none;border-color:var(--accent)}
.oq-pts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.oq-pts label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:8px 10px;cursor:pointer;font-size:15.5px;overflow-wrap:anywhere}
.oq-pts input{margin-top:3px;width:18px;height:18px;accent-color:var(--ok);flex:none}
.oq-pts label:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.oq-model{white-space:pre-line;font-size:15.5px;line-height:1.55;border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft)}
.oq-tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1px solid rgba(255,210,63,.5);padding:2px 7px}
.step{font:inherit;font-size:16.5px;text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;border:1px solid var(--line);padding:10px 12px;background:rgba(0,0,0,.35);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
.step .no{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);min-width:22px;padding-top:3px}
.step.placed{border-color:var(--line-strong);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.step.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default}
.step.wrong{border-color:var(--bad);background:var(--bad-soft);color:#ff8ea2;cursor:default}
.step:disabled{cursor:default}
.slot{border:1px dashed var(--line);padding:10px 12px;color:var(--muted);font-family:var(--f-mono);font-size:12.5px}
.clist{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:26px}
.clist li{padding-left:4px;overflow-wrap:anywhere}
.clist li::marker{color:var(--accent);font-family:var(--f-mono);font-size:.85em}
.note{font-size:15.5px;color:var(--muted);border-left:3px solid var(--line-strong);padding:4px 10px}

/* Konspekt (eingebettet) */
.ksp{display:flex;flex-direction:column;gap:var(--gap);font-size:15.5px;line-height:1.5}
.ksp section{border:1px solid var(--line);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px)}
.ksp h2{font-size:18px;margin:0 0 4px}
.ksp h3{font-family:var(--f-display);color:var(--accent);font-size:16.5px;margin:10px 0 2px;text-transform:uppercase;letter-spacing:.06em}
.ksp p{margin:0 0 4px}
.ksp ul,.ksp ol{margin:0 0 6px;padding-left:22px}
.ksp li{margin:0 0 3px;overflow-wrap:anywhere}
.ksp li::marker{color:var(--accent)}
.ksp b{color:var(--qink);font-weight:700}
.ksp .ru{color:var(--muted);font-size:.86em;font-weight:400;font-style:normal}
.ksp .ru::before{content:"("}.ksp .ru::after{content:")"}
.ksp .rub{display:block;color:var(--muted);font-size:.9em;margin-top:3px}
.ksp .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}

<!-- ============ 2 AKTIVITÄT & RUHE ============ -->
<section class="sec" id="k2">
<h2>2 · Aktivität &amp; Ruhe: Bewusstsein &amp; Schlaf</h2>
<div class="cols"><div>
<h3>Bewusstsein</h3>
<p><b>Definition</b> (Keller 2023): Gesamtheit aller psychischen Vorgänge (Gedanken, Gefühle, Wahrnehmungen) + Wissen um das eigene „Ich“; Voraussetzung, gezielt auf eigene Bedürfnisse und Umwelt zu reagieren.</p>
<p><b>Beobachtung:</b> Reaktion auf Ansprache? auf Schmerzreiz? Augen öffnen? Orientierung (persönlich, zeitlich, örtlich, situativ)? Bewegung nach Aufforderung?</p>
<p><b>Qualitative Störungen</b> <i class="ru">qualitative – "how" consciousness is altered</i>:</p>
<ul>
<li><b>Bewusstseinseintrübung</b> – Umwelt und eigene Person können nicht verbunden werden</li>
<li><b>Bewusstseinseinengung</b> – Fokus auf eine/wenige Thematiken</li>
<li><b>Bewusstseinsverschiebung</b> – subjektiv erweitertes Bewusstsein (z. B. Halluzinogene)</li>
</ul>
<p><b>Quantitative Störungen</b> <i class="ru">quantitative – "how much", increasing</i>:</p>
<div class="tw"><table>
<tr><th>Stufe</th><th>Merkmal</th></tr>
<tr><td>Absolute Wachheit</td><td>keine Störung</td></tr>
<tr><td>Benommenheit</td><td>verminderte Aufmerksamkeit, verlangsamt</td></tr>
<tr><td>Somnolenz</td><td>schläfrig, durch <b>einfache</b> Reize erweckbar</td></tr>
<tr><td>Sopor</td><td>schläft, nur durch <b>starke</b> Reize erweckbar</td></tr>
<tr><td>Koma</td><td>bewusstlos, reaktionslos, keine physiologischen Reflexe</td></tr>
</table></div>
<h3>Glasgow Coma Scale (GCS)</h3>
<div class="tw"><table>
<tr><th>Augenöffnen</th><th>Sprache</th><th>Motorik</th></tr>
<tr><td>4 spontan<br>3 auf Ansprache<br>2 auf Schmerzreiz/Druck<br>1 keines</td><td>5 orientiert<br>4 verwirrt<br>3 unverständliche Wörter<br>2 unverständliche Laute<br>1 keine</td><td>6 befolgt Aufforderungen<br>5 gezielte Abwehr (lokalisiert)<br>4 ungezielte Abwehr (beugt normal)<br>3 Beugesynergien (abnormal)<br>2 Strecksynergien<br>1 keine</td></tr>
</table></div>
<p><b>Ablauf (Teasdale 2015):</b> Prüfen (Einschränkungen, z. B. Intubation) → Beobachten (Augen, Sprache, Motorik re+li) → Stimulieren (akustisch; physisch: Druck auf Fingerspitzen, Trapezius, Foramen supraorbitale) → Einstufen nach der <b>höchsten</b> beobachteten Reaktion. Nicht beurteilbar = <b>NT</b>.</p>
</div><div>
<h3>Schlaf</h3>
<p>Physiologische Bewusstseinsveränderung; Regeneration; Dauer nimmt mit dem Alter ab; Steuerung: Schlaf-Wach-Zentrum im <b>Hirnstamm</b>; permanenter Schlafentzug → körperliche/psychische Erkrankungen.</p>
<p><b>Schlafkriterien:</b> geschlossene Augen · ruhige Atmung · verminderte Reaktion auf Reize · <b>Erweckbarkeit</b> <i class="ru">arousability distinguishes sleep from coma</i>.</p>
<div class="tw"><table>
<tr><th>Phase</th><th>Besonderheit</th></tr>
<tr><td>N1 Einschlafen</td><td>wenige min, ~5 %, Alpha → Theta</td></tr>
<tr><td>N2 leichter Schlaf</td><td>längste ~50 %, Schlafspindeln, K-Komplexe</td></tr>
<tr><td>N3 Tiefschlaf</td><td>sehr schwer erweckbar, Deltawellen, 20–25 %</td></tr>
<tr><td>REM</td><td>Augenrollen, Muskeltonus stark ↓, „Traumphase“, 10–15 min</td></tr>
</table></div>
<p>Jeder Zyklus endet mit REM · 1. Nachthälfte mehr <b>Tiefschlaf</b>, 2. Nachthälfte mehr <b>REM</b>.</p>
<p><b>Normwerte Erw.:</b> 5–9 h · Latenz 1–20 min · Tiefschlaf ~20 % · REM ~20 % · 4–7 Zyklen à ~90 min.</p>
<p><b>Schlaftypen:</b> mono- (1 Block), bi- (2 Blöcke, z. B. + Mittagsschlaf), polyphasisch (mehrere).</p>
<p><b>Dyssomnien:</b> Insomnie (Ein-/Durchschlafstörung) · schlafbezogene Atemstörung (Apnoe) · Hypersomnolenz (Narkolepsie) · zirkadiane Störung (Schicht, Jetlag, Blinde) · Parasomnien (Schlafwandeln, Pavor nocturnus) · Bewegungsstörungen (Restless Legs, Zähneknirschen).</p>
<p><b>Ursachen:</b> physisch (Schmerz, Fieber, Inkontinenz) · pharmakologisch (Koffein, Steroide, Entzug Sedativa) · psychosozial · psychiatrisch · schlechte Schlafhygiene (Handy, späte Mahlzeit, abends Sport) · physiologisch (Schicht, Jetlag, Kurzhospitalisation).</p>
<p><b>Schlafanamnese:</b> Qualität/Dauer · Schlafmittel · Störfaktoren · Rituale/fördernde Maßnahmen.</p>
<p><b>Im KH:</b> Schmerz → Schmerztherapie · Pflegetätigkeiten → Zeitpunkt/Häufigkeit evaluieren · Lärm/Licht → reduzieren · Ängste → Gespräch · Mehrbettzimmer → Konsens · fremde Umgebung → vertraute Gegenstände, Rituale.</p>
<p><b>Schlaffördernd:</b> Tees (Melisse, Hopfen, Johanniskraut, Passionsblume), heiße Milch mit Honig · Baldrian, Orangenblüten · Aromapflege · <b>ASE</b> · warmes Fußbad · Basale Stimulation/Snoezelen · warmer Bauchwickel.</p>
<p><b>Nachteile Hypnotika:</b> verändertes Schlafmuster, Überhang, Rebound-Insomnie, Toleranz, Abhängigkeit, Atemdepression, paradoxe Reaktionen, Gedächtnisstörung, Muskelrelaxation (→ Sturz), Wechselwirkungen.</p>
<div class="box merk"><b>ASE – atemstimulierende Einreibung</b> (Basale Stimulation): keine ärztliche Anordnung nötig; Ziel gleichmäßige, ruhige, tiefe Atmung. Indikation: flache/schnelle/unregelmäßige Atmung, Schmerz, Beatmungsentwöhnung, Beziehungsaufbau, Einschlafförderung. <b>KI:</b> offene/schmerzende Haut am Rücken, Rippenserienbruch, nach Thorax-OP.</div>
</div></div>
</section>

<!-- ============ 3 HYGIENE ============ -->
<section class="sec" id="k3">
<h2>3 · Hygiene, Wäsche &amp; Krankenbett</h2>
<div class="cols"><div>
<h3>Hygienische Händedesinfektion (FRL 01)</h3>
<p><b>Wirksamste Einzelmaßnahme</b> gegen Infektionsketten; tötet 99,999 % der Keime (5 log-Stufen), 100× wirksamer als Seifenwaschung. Bei „an sich sauberen“ Händen nur desinfizieren, nicht waschen.</p>
<p><b>Voraussetzungen:</b> gesunde intakte Haut (Wunden flüssigkeitsdicht verbinden) · kein Schmuck an Händen/Handgelenken · Nägel kurz, sauber, <b>kein Nagellack/keine künstlichen Nägel</b> (Ausnahme: fachärztliches Attest).</p>
<p><b>Technik:</b> auf <b>trockene</b> Hände 3–6 ml (2–4 Hübe), mind. <b>30 s</b> feucht halten, bis eine Handbreite über das Handgelenk; besonders Fingerspitzen, Nagelfalze, Daumen.</p>
<p><b>Standard-Einreibemethode EN 1500</b> (je ~5 s, jede Bewegung 5×):</p>
<ol>
<li>Handfläche auf Handfläche</li>
<li>Rechte Handfläche über linken Handrücken – und umgekehrt</li>
<li>Handfläche auf Handfläche mit verschränkten, gespreizten Fingern</li>
<li>Außenseite der verschränkten Finger auf gegenüberliegende Handflächen</li>
<li>Kreisendes Reiben des Daumens in geschlossener Handfläche</li>
<li>Kreisendes Reiben der Fingerkuppen in der Handfläche</li>
</ol>
<h3>5 Indikationen (WHO)</h3>
<ol>
<li><b>VOR</b> Patientenkontakt (Vitalzeichen, Palpieren, vor Handschuhen)</li>
<li><b>VOR</b> aseptischen Tätigkeiten (Konnektion invasiver Devices, Injektion, Punktion; Wechsel kontaminiert → sauber)</li>
<li><b>NACH</b> Kontakt mit potentiell infektiösem Material (Körperflüssigkeiten, Schleimhaut, Wundverband, nach Handschuhen)</li>
<li><b>NACH</b> Patientenkontakt</li>
<li><b>NACH</b> Kontakt mit Oberflächen der unmittelbaren Patientenumgebung (Bett, Infusomat, Monitor)</li>
</ol>
<p class="small">Weitere: Dienstbeginn/-ende, vor Arzneimitteln, vor Essensausgabe, nach WC, Niesen, Schmutzarbeiten (Betten abziehen). LPZ: Nr. 5 entfällt bei mobilen Bewohnern. Handschuhe/Waschen sind <b>kein Ersatz</b>; Handschuhdesinfektion nicht empfohlen.</p>
<h3>Händewaschen (FRL 03)</h3>
<p><b>Wann:</b> Dienstbeginn/-ende, sichtbare Verschmutzung, nach Mittagspause, nach WC, vor Lebensmitteln, nach Desinfektion bei <b>Clostridioides difficile</b> <i class="ru">spores – alcohol does not work</i>.</p>
<p><b>Ablauf:</b> handwarm einstellen → anfeuchten → Seife, ≥ 30 s aufschäumen → abspülen vom Handgelenk zu den Fingerspitzen → Einmalhandtuch (Fingerzwischenräume) → Hahn mit Einmalhandtuch schließen. Waschen reduziert nur 1–2 log-Stufen. Heißluft-Trockner ungeeignet.</p>
<p><b>Hautschutz</b> vor belastenden Tätigkeiten (zieht schnell ein); <b>Hautpflege</b> nach Arbeit/Freizeit (Regeneration). Keine Gemeinschaftstiegel.</p>
</div><div>
<h3>Persönliche Hygiene (FRL 20)</h3>
<ul>
<li>Nägel kurz, sauber; kein Nagellack/Kunstnägel</li>
<li>Lange Haare nicht offen; Stirnfransen max. Augenbrauenhöhe</li>
<li>Dienstkleidung mind. <b>täglich</b> + sofort bei Kontamination; geschlossen tragen; nur im KH-Areal; keine Privatkleidung darüber</li>
<li>Keine langen Ärmel bei intensivem Körperkontakt; kein Shirt, das hervorragt</li>
<li>Kein Schmuck an Händen/Unterarmen (auch keine Uhr), kein großer Ohrschmuck, keine langen Ketten; Piercing nicht an Händen/Unterarmen</li>
<li>Kopftuch: tägl. wechseln, gegen Verrutschen sichern, <b>keine Stecknadeln</b>, ≥ 60 °C waschen; im OP Haube darüber</li>
<li>Schuhe abwaschbar/desinfizierbar, nur im KH</li>
<li>Frische Tattoos/Wunden dicht abdecken</li>
<li>Essen nur in vorgesehenen Räumen; privates Essen nie im Medikamentenkühlschrank</li>
</ul>
<h3>Wäschegebarung (FRL 19)</h3>
<p>Händedesinfektion: <b>vor dem Betten, vor Reinwäsche, nach Schmutzwäsche</b>.</p>
<p><b>Reinwäsche:</b> Transport geschlossen · Lagerung staubgeschützt, <b>First-in-first-out</b> · nur sinnvolle Menge ins Zimmer · Ablagefläche vorher schnell desinfizieren · <b>nie</b> Kontakt mit Schmutzwäsche oder Boden · nicht zurück in den Wäschekasten.</p>
<p><b>Schmutzwäsche:</b> Wechsel nach Bedarf, sofort bei sichtbarer Verschmutzung · <b>täglich</b> bei MRE (nach antiseptischer Waschung) und Ektoparasiten (Scabies, Läuse) · PSA: Handschuhe + flüssigkeitsdichter Übermantel bei Blut/Sekreten · direkt in Wäschesack am fahrbaren Sammler (Deckel), <b>nie auf Boden/Sessel</b> · beim Abwurf sortieren, nicht nachsortieren · Sack nicht überfüllen, sofort verschließen · Zwischenlagerung im <b>unreinen Arbeitsraum</b> · Transport nur verschlossen · durchnässte Wäsche in flüssigkeitsdichten Sack.</p>
<h3>Krankenbett / Bettwäschewechsel</h3>
<p><b>Grundprinzipien:</b> Hygiene · Intimsphäre · Sicherheit · Patient:innenorientierung · Kommunikation · Ergonomie · Wirtschaftlichkeit <i class="ru">mnemonic "HISPKEW"</i>.</p>
<p><b>Varianten:</b> leeres Bett ab-/beziehen · bei liegenden Patient:innen <b>von der Seite</b> oder <b>vom oberen/unteren Bettende</b>.</p>
<div class="box falle">Konkrete Schrittfolge des Bettwäschewechsels steht <b>nicht</b> in den Unterlagen – nur Prinzipien + FRL 19. In der Prüfung die Prinzipien laut aussprechen.</div>
</div></div>
</section>

<!-- ============ 4 VITALFUNKTIONEN ============ -->
<section class="sec" id="k4">
<h2>4 · Vitalfunktionen</h2>
<div class="cols"><div>
<p><b>Vitalparameter</b> = Messgrößen lebenswichtiger Körperfunktionen. Werte immer mit dem subjektiven Befinden abgleichen; Messgeräte sind Medizinprodukte.</p>
<h3>Fieberkurve = Dokument</h3>
<p>Puls <b>rot</b> (1 Zeile = 4 Schläge), Temperatur <b>blau</b> (1 Zeile = 0,2 °C), erster Eintrag mit <b>X</b>, dann verbinden; RR als Zahl sys/dia. Falsch verbundene Linie durchstreichen. Überwachungsblatt bei häufigen Kontrollen lt. ÄAO.</p>
<h3>Puls</h3>
<p>Herzkontraktion → Pulswelle in peripheren Arterien. <b>Kriterien:</b> Frequenz · Rhythmus · Qualität (hart/weich).</p>
<p><b>Technik:</b> A. radialis, Zeige-, Mittel-, Ringfinger; 15 s × 4 bei regelmäßigem Puls; <b>1 min</b> bei Aufnahme und Arrhythmie. Nie mit dem Daumen (Eigenpuls).</p>
<p><b>Fehler:</b> Daumen · zu leichter/starker Druck · Gefäßverengung · unmittelbare Belastung.</p>
<p><b>Wann:</b> Aufnahme, Veränderung anderer Vitalwerte, Herz-/Lungenkrankheit, postoperativ (Blutung), invasive Untersuchungen, Notfall, kreislaufwirksame Medikamente.</p>
<p><b>Bradykardie</b> &lt; 60 (Sportler, Schlaf; Betablocker, Digitalis, Hirndruck) · <b>Tachykardie</b> &gt; 100 (Fieber, Schmerz, Angst, Blutverlust, Hyperthyreose). <b>Asystolie</b> = Pulslosigkeit → Herzalarm.</p>
<h3>Blutdruck</h3>
<p>Kraft des Blutes auf die Gefäßwände (mmHg); abhängig von Pumpleistung + Gefäßwiderstand. Systolisch = Auswurfphase, diastolisch = Erschlaffung.</p>
<p><b>Technik:</b> Manschette in <b>Herzhöhe</b>, ~2/3 Oberarm, gleiche Bedingungen (Ruhe, gleiche Position, gleicher Arm). Erstaufnahme <b>beidseits</b> messen. Auskultatorisch (Korotkow-Töne) oder oszillometrisch.</p>
<p><b>Nicht messen</b> an Extremität mit: Gefäßzugang · <b>Lymphödem</b> · <b>Dialyseshunt</b> · Knochen-/Muskel-/Bindegewebserkrankung · Hauterkrankung/frische Verletzung.</p>
<p><b>Fehlerquellen:</b> Luft zu schnell ablassen · zu wenig aufgepumpt · über Kleidung · beengende Kleidung · falsche Breite · zu locker · Arm falsch · zu lange gestaut · Lärm · Unruhe · Stethoskop mit Daumen gedrückt.</p>
<p><b>Hypotonie</b> &lt; 105/60 (Schock, Blutverlust; Schwindel, Synkope) · <b>Hypertonie</b> &gt; 140/90 (Kopfschmerz, Nasenbluten). Tabelle Erw.: optimal &lt;120/&lt;80 · normal 120–129/80–84 · hochnormal 130–139/85–89 · Hypertonie 140–159/90–99.</p>
</div><div>
<h3>Atmung</h3>
<p><b>Eupnoe:</b> regelmäßig, gleichmäßig tief, geräuscharm, geruchlos. <b>Dyspnoe</b> = subjektive Atemnot; <b>Orthopnoe</b> = starke Dyspnoe im Liegen. Inspiration aktiv, Exspiration passiv, Verhältnis <b>1 : 2</b>.</p>
<p><b>Kriterien:</b> Frequenz · Qualität (Tiefe, Hilfsmuskulatur, Hautfarbe) · Rhythmus · Geräusche · Geruch · Husten/Sputum.</p>
<p><b>Zählen:</b> unbemerkt, <b>1 min</b>, Tipp: nach dem Puls die Finger am Arm lassen; Bewusstlose: Hand auf den Thorax.</p>
<p><b>Werte:</b> NG 30–50 · Kleinkind 20–30 · Erw. 12–18. Bradypnoe &lt; 12 (Schlaf, SHT, Vergiftung) · Tachypnoe &gt; 18–20 (Anstrengung, Fieber, Schmerz). Apnoe = Atemstillstand → Notfall.</p>
<p><b>Rhythmus pathologisch:</b> Kussmaul, Cheyne-Stokes, Schnappatmung, Biot. <b>Geräusche:</b> inspiratorischer Stridor (Pseudokrupp), exspiratorischer Stridor (Asthma), Giemen/Brummen (trocken), Trachealrasseln (feucht). <b>Geruch:</b> Azeton, Ammoniak, Foetor hepaticus/uraemicus, Fäulnis, Eiter.</p>
<p><b>Sauerstoff</b> = Medikament (Dosis, Dauer, Art lt. ÄAO); <b>im Notfall kurzfristig ohne Anordnung</b> erlaubt. Pulsoxymetrie: Rotlicht-Absorption; Sensor regelmäßig wechseln (Druckstellen).</p>
<div class="box merk"><b>Erstmaßnahmen Atemnot:</b> Alarm/Hilfe · Arzt informieren · beengende Kleidung + Fenster öffnen · nicht allein lassen, Ruhe · <b>OK hoch</b> (bei Herzinsuffizienz Beine tief) · Medikation lt. AO · Lippenbremse · O₂ lt. ÄAO · ggf. absaugen · Bewusstsein + alle Vitalwerte · Dokumentation.</div>
<h3>Körpertemperatur</h3>
<p>Kerntemperatur ~37 °C; Wärmebildung = Wärmeabgabe; Zentrum <b>Hypothalamus</b>. Normal 36,5–37,4 · <b>Hypothermie &lt; 36</b> · <b>Hyperthermie</b> = ohne Sollwerterhöhung (Hitzeschlag) · <b>Fieber &gt; 38,0</b> = Sollwerterhöhung.</p>
<p><b>Stufen:</b> subfebril 37,5–38,0 · leicht 38,1–38,5 · mäßig 38,6–39,0 · hoch 39,1–39,9 · sehr hoch 40–42 (&gt; 42 Eiweiß denaturiert).</p>
<p><b>Messorte:</b> Stirn, Gehörgang, sublingual, Achsel, Leiste, rektal/vaginal. Analog ~5 min, digital ~2 min, Infrarot Sekunden. Schutzhülle; keine kalten/warmen Getränke vor sublingual; rektal in Seitenlage mit Gleitmittel. Passt das Ergebnis zur Beobachtung? ggf. nachmessen.</p>
<p><b>Fieberphasen:</b> Anstieg (Frösteln, Schüttelfrost → wärmen, warme Getränke) · Höhe (<b>Wadenwickel</b> nur hier) · Abfall: <b>Lysis</b> (langsam) / <b>Krisis</b> (rasch, Kreislauf!). Ziele: Ursache erkennen, Komplikationen vermeiden, Wohlbefinden.</p>
<p><b>Alte Menschen:</b> geringes Fieber, rasch Kreislaufprobleme, Durst ↓ → zum Trinken auffordern. <b>Kinder:</b> Wärmeregulation unreif, Trinkmenge dokumentieren, Fieberkrampf.</p>
</div></div>
</section>

<!-- ============ 5 SICHERHEIT ============ -->
<section class="sec" id="k5">
<h2>5 · Sicherheit, Perzeption &amp; Kognition</h2>
<div class="cols"><div>
<h3>Wahrnehmung &amp; Beobachtung</h3>
<p><b>Wahrnehmung</b> = Reize über Sinnesorgane aufnehmen und verarbeiten → subjektives Abbild. <b>Beobachtung</b> = zielgerichtete, systematische Wahrnehmung.</p>
<p><b>5 Schritte:</b> Reizaufnahme + Umwandlung in Nervenimpulse → Weiterleitung ans Gehirn → Sortierung/Vergleich mit Mustern → Weiterleitung an andere Zentren (limbisches System) → Reaktion.</p>
<p><b>Sinne:</b> visuell, auditiv, olfaktorisch, gustatorisch, vestibulär, taktil (Mechano-, Thermo-, Nozizeption).</p>
<p><b>Psychologisch:</b> Selektion · Ergänzung/Strukturierung · Interpretation. Einflüsse körperlich (Gewöhnung, Verschmelzung, Schwelle) und psychisch (Interessen, Emotion, Erfahrung, soziale Situation).</p>
<div class="tw"><table>
<tr><th>Wahrnehmungsfehler</th><th>Bedeutung</th></tr>
<tr><td>Rosenthal-Effekt</td><td>Einfluss durch Urteil anderer</td></tr>
<tr><td>Halo-/Hofeffekt</td><td>eine Eigenschaft überstrahlt andere</td></tr>
<tr><td>Vorabinformation</td><td>Übergabe, Befunde prägen</td></tr>
<tr><td>Kontrastfehler</td><td>im Vergleich überdeutlich</td></tr>
<tr><td>Stereotype</td><td>Gruppe gleiche Eigenschaften</td></tr>
<tr><td>Milde-Effekt</td><td>Sympathie beeinflusst</td></tr>
<tr><td>Zentrale Tendenz</td><td>Bewertung immer in der Mitte</td></tr>
</table></div>
<p><b>Patient:innenbeobachtung:</b> Ziele: Zustand/Befinden erkennen · Probleme, Ressourcen erheben · Wünsche, Ängste wahrnehmen. <b>Objektiv</b> = messbar (RR, Gewicht); <b>subjektiv</b> → mit Skalen und im Team objektivieren. Dokumentation = Basis des Pflegeprozesses, rechtlich nötig.</p>
<h3>Sehbeeinträchtigung</h3>
<p>80 % der Infos über das Auge. Probleme: Verletzungsgefahr, Isolation, Depression. <b>Maßnahmen:</b> anklopfen + warten, Verlassen ankündigen · mit Namen ansprechen, eigenen Namen nennen · Anwesende vorstellen · Dinge (Medikamente, Kleidung) <b>immer am gleichen Platz</b> · vor jeder Maßnahme informieren · <b>normale Lautstärke</b> · Licht nach Wunsch · Klingel/Türrahmen markieren · <b>Türen schließen</b> · beim Essen sagen, wie angerichtet ist. <b>Führen:</b> Richtungswechsel ankündigen, auf Schwingtüren/Unebenheiten hinweisen, Stuhl ertasten lassen.</p>
</div><div>
<h3>Hörbeeinträchtigung</h3>
<p>Mehr Zeit einplanen · auf sich aufmerksam machen · <b>Blickkontakt</b> · Mund nicht verdecken · langsam, deutlich, <b>nicht lauter</b> · Mimik/Gestik normal · kurze Sätze · Hochdeutsch · im Zweifel aufschreiben.</p>
<p><b>Hörgeräte:</b> HdO (einfache Bedienung) · IdO · Gehörgangs-System (unauffällig, Reinigung schwierig). Schweigt/zu leise → Batterie, eingeschaltet, Ohrpassstück verstopft, Zerumen. Pfeift → Ohrpassstück falsch/zu klein, Schlauch kaputt. <b>Don'ts:</b> Wasser, Hitze (Föhn), Stöße, Chemikalien (Haarspray), vor Bestrahlung entfernen; Batterien rechtzeitig wechseln.</p>
<h3>Stich- &amp; Schnittverletzung</h3>
<p><b>Erstmaßnahmen:</b> Wunde gut <b>auspressen</b> und ausgiebig <b>desinfizieren</b> · Schleimhaut/Auge spülen · Patientendaten + Serologie, Blutabnahme · Meldung (Arbeitsmedizin; Praktikum: AUVA + FH) · Dokumentation. Gefahr Hep B/C, HIV. <b>Prävention:</b> <b>kein Recapping</b>, sofort in stichfeste Behälter vor Ort.</p>
<h3>Medikamentengebarung</h3>
<p><b>Arzneimittel</b> = Wirk- + Hilfsstoffe; Placebo ohne Wirkstoff. Handelsname ® (20 J. Patent), Generika = Kopien, INN = Freiname. <b>AMG:</b> frei verkäuflich · apothekenpflichtig · verschreibungspflichtig · Betäubungsmittel (BtM-Rezept).</p>
<p><b>Pharmakokinetik</b> = was der Körper mit dem Wirkstoff macht · <b>Pharmakodynamik</b> = was der Wirkstoff mit dem Körper macht.</p>
<p><b>Applikation:</b> lokal / systemisch: enteral (p.o., s.l., bukkal, rektal) · parenteral (s.c., i.c., i.m., i.v.) · weitere (nasal, inhalativ, transdermal, konjunktival …).</p>
<p><b>Lagerung:</b> abschließbarer Schrank, 1× monatlich reinigen, Verfall prüfen, FIFO, <b>nie umfüllen</b>, Originalpackung + Beipackzettel, Temperatur/Lichtschutz. Halbierte AM entsorgen. Verfärbung/Geruch → nicht verwenden.</p>
<p><b>Richten:</b> schriftliche Anordnung (Name, Geb.-Datum, Präparat, Form, Dosis, Zeit) · Händedesinfektion · angebrochene Packung („X“) zuerst · <b>3× kontrollieren</b> (Herausnehmen, Entnahme, Zurückstellen) · nie mit der Hand berühren · <b>4-Augen-Prinzip</b> · Tablett bis zum Austeilen versperrt.</p>
<div class="box merk"><b>10-R-Regel:</b> Person · Medikament · Dosierung · Applikationsform · Zeitpunkt · Anwendungsdauer · Aufbewahrung · Risikomanagement · Dokumentation · Entsorgung. Fehler <b>sofort melden</b>.</div>
<p><b>Salben/Tuben:</b> nicht einrollen · Konus mit keimarmem Tupfer reinigen · Verschluss mit Alkoholtupfer · Verschluss verloren → verwerfen · Tiegel nur mit sauberem Spatel. <b>BtM:</b> getrennt versperrt, Buch mit Menge, Datum, Patient, Unterschrift Arzt + Pflege, neuer Bestand.</p>
<h3>Freiheitsbeschränkung &amp; Sturz (Sturzleitlinie 2025)</h3>
<p><b>Sturz</b> = Person kommt unbeabsichtigt auf dem Boden oder tieferer Ebene zu liegen. FbM (Bettgitter, Gurte, Sedierung, Alarme) <b>senken das Sturzrisiko nicht</b>; nur im Einzelfall, <b>gelindestes Mittel</b>, Anordnung Arzt/DGKP, dokumentieren, regelmäßig evaluieren, mit Angehörigen besprechen (HeimAufG, UbG). Bett niedrig stellen, Rufglocke/Brille/Gehhilfe in Reichweite, Boden trocken, Licht, feste rutschfeste Schuhe (keine Antirutschsocken als 1. Wahl).</p>
</div></div>
</section>

<!-- ============ 6 KÖRPERPFLEGE ============ -->
<section class="sec" id="k6">
<h2>6 · Körperpflege &amp; Thromboseprophylaxe</h2>
<div class="cols"><div>
<h3>Haut</h3>
<p>Größtes Sinnesorgan, „Spiegel der Seele“. <b>Funktionen:</b> Schutz · Temperaturregelung · Sinneswahrnehmung · Aufnahme/Ausscheidung · Speicher · Formgebung · Kommunikation.</p>
<p><b>Beobachtung:</b> Hauttyp/-alter · Farbe · Temperatur (28–33 °C) · Oberfläche · <b>Turgor</b> (Faltentest: Exsikkose; Ödem).</p>
<p><b>Hauttypen:</b> fettig (seborrhoisch) · trocken (sebostatisch, Juckreiz) · Mischhaut (T-Zone fettig).</p>
<div class="tw"><table>
<tr><th>Farbe</th><th>physiologisch</th><th>pathologisch</th></tr>
<tr><td>Rötung</td><td>Sport, Hitze, Aufregung</td><td>Fieber, Entzündung, Hypertonie</td></tr>
<tr><td>Blässe</td><td>Schreck, Angst</td><td>Blutung, Hypotonie, Anämie</td></tr>
<tr><td>Ikterus</td><td>Neugeborene, Karotten</td><td>Leber, Galle</td></tr>
<tr><td>Zyanose</td><td>Kälte</td><td>Herzleistung ↓, Asthma, COPD</td></tr>
</table></div>
<h3>Nähe, Distanz, Intimität, Scham</h3>
<p><b>Distanzzonen:</b> intim · persönlich · sozial · öffentlich. Professionelle Beziehung („Sie“ + Nachname), Empathie ohne eigene Bedürfnisse zu vergessen.</p>
<p><b>Privatsphäre schützen:</b> Maßnahmen bündeln, Ruhezeiten · <b>anklopfen</b> · Sichtschutz, mobile Personen hinaus bitten · Bad nutzen · lüften. Zustimmung einholen, Schritte erklären.</p>
<p><b>Individualität:</b> Gewohnheiten (Zeit, Produkte, Dusche/Waschbecken), eigene Kleidung, Ressourcen nutzen, beruhigende/belebende Waschung.</p>
<p><b>Ekel</b> angeboren (Geruch/Geschmack) + kulturell; Strategien: Prävention, im Team ansprechen, Pausen, Schutz (Handschuhe, Schürze). <b>Scham</b> ab 2. Lj. (Verbotenes), körperlich ab ~6. Lj.; ignorierte Scham → Angst, Aggression, Schmerz ↑.</p>
<p><b>Heusinger &amp; Dummert 2017:</b> stärkstes genderspezifisches Bedürfnis = Frauen wünschen eine <b>weibliche Pflegekraft</b>; nur selten setzen sie es durch → Bewohner:innen sollen mitbestimmen (Geschlecht, Duschhäufigkeit).</p>
<h3>Körperpflege – Grundsätze</h3>
<p><b>Ziele:</b> Wohlbefinden · Wahrnehmung/Kommunikation · Selbstpflege, Ressourcen · Krankheiten vorbeugen.</p>
<p><b>Vorher:</b> Fenster/Türen zu · Händedesinfektion · ggf. Schürze · alles Material vorbereiten. Nicht zu zweit gleichzeitig waschen; Tempo anpassen; nur dort aufdecken, wo nötig; nicht im Nassen liegen lassen; eigenes Duschgel.</p>
<p><b>Handlungsschema GKW im Bett:</b> Vorbereitung → Durchführung → Nachbereitung → Evaluation.</p>
<p><b>Hautreinigung:</b> Duschen besser als Baden · niedrige Wassertemperatur · zu viel Reinigung schadet · pH-neutral. <b>Pflege:</b> O/W für normale bis fettige Haut, W/O für trockene · Pasten mit Wirkstoff (Zink) · Pflanzenöle bei sehr trockener Haut · wenig Duftstoffe.</p>
<p><b>Gesicht:</b> Augen von <b>außen nach innen</b> · Nase: bei O₂-Therapie NaCl/Nasensalbe · Ohren: kein Wasser hinein, keine Wattestäbchen · Rasur in Haarwuchsrichtung, Nassrasur Cave Antikoagulation.</p>
<p><b>Waschbecken:</b> Kreislauf überwachen (Kollaps); <b>Dusche:</b> Sturzgefahr.</p>
</div><div>
<h3>Intertrigoprophylaxe</h3>
<p>Intertrigo = oberflächliche Entzündung in Hautfalten durch Feuchtigkeit, Wärme, Verunreinigung (DD: IAD). <b>3× tgl.</b> beobachten · <b>2× tgl.</b> mit klarem Wasser waschen, <b>tupfen</b> · Hautschutz (Cavilon) · fusselfreie Kompressen/Leinen faltenfrei einlegen (InterDry) · Schwitzen ↓ · Föhnen überlegt · Pilz → Antimykotikum lt. AA.</p>
<h3>Mundpflege</h3>
<p>Ziele: Reinigung, Schleimhaut feucht, Infektionen vermeiden. Norm: Schleimhaut rosa, feucht, glänzend; Zunge feucht, belagfrei; Lippen rosig. Goldstandard = <b>Zähne putzen</b> (DNQP 2023). Risiko: Onkologie, Intensiv, Insult, Geriatrie, Demenz, Schwangere, Kinder.</p>
<p><b>Kinder:</b> ab 1. Zahn, 2× tgl.; Zahnpasta bis 2 J. <b>reiskorn</b>-, 2–6 J. <b>erbsen</b>groß, ab 6 J. Bürstenkopf; ausspucken, nicht ausspülen.</p>
<p><b>Prothese:</b> mechanisch + chemisch; nachts <b>trocken</b> in der Schale (Candida ↓).</p>
<p><b>Bewusstseins-/Schluckstörung:</b> Aspiration – <b>keine Flüssigkeit</b> in den Mund. Abwehr: Beziehung, von der Seite auf Augenhöhe, vor dem Spiegel, keine Kindersprache, ggf. PP wechseln.</p>
<p><b>Soor</b> (Candida, weiße schwer abwischbare Beläge): mind. 1× tgl. inspizieren, 2× tgl. Mundpflege, feucht halten, Flüssigkeit; Behandlung: 2–3× tgl. Schleimhautdesinfektion, Antimykotikum lt. AA (Pipette nicht in den Mund), Einmalzahnbürste, Schnuller/Sauger desinfizieren.</p>
<p><b>Parotitis</b> (Ohrspeicheldrüse, Staph./Strept.): Risiko Nahrungskarenz, Flüssigkeitsmangel → <b>Speichelfluss anregen</b>: kauen (Kaugummi, Dörrobst, Brotrinde), saure zuckerfreie Bonbons, Eiswürfel, trinken, Parotis massieren, ggf. Speichelersatz.</p>
<h3>Thromboseprophylaxe</h3>
<p><b>Virchow-Trias:</b> verlangsamte Strömung (Kreislauf) · Gefäßwandschaden (Wand) · Gerinnung ↑ (Blut). Pflegeziel: <b>venösen Rückfluss</b> verbessern.</p>
<p><b>TVT-Zeichen:</b> Druckschmerz (Wade, Fußsohle, Kniekehle, Leiste), Schwellung, Rötung, livide, Überwärmung; Puls/Temp ↑, Atemnot, Brustschmerz → <b>Lungenembolie</b>! → Arzt, Mobilisation nur nach Rücksprache.</p>
<p><b>Risiko:</b> niedrig → Basismaßnahmen · mittel/hoch → Basis + medikamentös.</p>
<p><b>Basismaßnahmen:</b> Frühmobilisation (Muskel-Venen-Pumpe) · Bewegungsübungen · Flüssigkeit · MTS lt. AA.</p>
<p><b>MTS:</b> alleinige Wirksamkeit nicht nachgewiesen · Einschnürung → Thrombose! · 15–20 min Ruhe vor Anlegen · kontinuierlich v. a. im Liegen · nur weiß, Seriengröße, Zehenloch (Durchblutungskontrolle). Messen: Knöchel-, Wadenumfang, Länge. Kompressionsstrumpf = Therapie, verordnet, 4 Klassen.</p>
</div></div>
</section>

<!-- ============ 7 ERNÄHRUNG & AUSSCHEIDUNG ============ -->
<section class="sec tight" id="k7">
<h2>7 · Ernährung &amp; Ausscheidung</h2>
<div class="cols"><div>
<p><b>Energiebedarf</b> = Grundumsatz + Leistungsumsatz. <b>EDEKA-Regel</b> (Essensauswahl): <b>E</b>mpfindlichkeiten · <b>D</b>iätetische Kost · <b>E</b>inschränkungen bei Nahrungsaufnahme · <b>K</b>rankheitsbedingte Kost · <b>A</b>llergien + kulturell/religiös.</p>
<p><b>Essplatz:</b> richtiger Patient, richtiges Essen, richtiger Zeitpunkt; Sitzposition!</p>
<p><b>Essen eingeben:</b> Atmosphäre, Zeit · gemeinsam besprechen · <b>neben</b> der Person sitzen · Temperatur prüfen lassen · Besteck von vorne unten · Brot mit Gabel · Mund leer vor dem nächsten Bissen · <b>Konsistenzen nicht mischen</b> · Pausen · Serviette, nie Löffel zum Wischen · so viel wie nötig, so wenig wie möglich.</p>
<p><b>Hilfsmittel:</b> gewinkeltes Besteck, Griffverstärkung, Thermoteller, Schneidebrett, Becher mit Nasenausschnitt, Schnabelbecher. <b>Zusatznahrung</b> wenn Bedarf nicht gedeckt.</p>
<p><b>Erhebung:</b> Größe, Gewicht + Verlauf, Oberarm-/Wadenumfang, BMI = kg/m², Screening (NRS, MUST, GMS, MNA), Teller-, Trinkprotokoll, Bilanz.</p>
<p><b>BMI:</b> &lt; 16 schwer · 16–16,9 mäßig · 17–18,4 leicht unter · 18,5–24,9 normal · 25–29,9 Präadipositas · 30–34,9 / 35–39,9 / ≥ 40 Adipositas I/II/III. Allein wenig aussagekräftig; im Alter höher akzeptiert.</p>
<p><b>Mangelernährung</b> = anhaltendes Defizit an Energie/Nährstoffen durch negative Bilanz. Folgen: Kraft ↓ → Sturz, Pneumonie, Infekte, <b>Dekubitus</b>, Verwirrtheit, Wundheilung ↓, Mortalität ↑.</p>
<h3>Flüssigkeitsbilanz</h3>
<p>Zufuhr ≈ Abgabe ≈ 2,5 l/Tag. Zufuhr: Getränke 1,3 l, Nahrung 0,9 l, Oxidationswasser 0,3 l. Abgabe: Urin 1,5 l, Atmung + Haut 0,9 l, Stuhl 0,1 l.</p>
<div class="box"><b>Rechenbeispiel Fr. Huber</b> (Tasse/Glas 200 ml): Einfuhr 2 Kaffee 400 + Saft 200 + Tee 200 + Bier 200 + Kaffee 200 + Infusion 500 + Tee 200 = <b>1900 ml</b>; Urin 450 + 450 + 250 + 550 = <b>1700 ml</b> → Bilanz <b>+200 ml</b>. <i class="ru">she skipped the soup – not counted; food not counted</i></div>
<h3>Aspirationsprophylaxe</h3>
<p>Verhindert Eindringen von Nahrung/Fremdkörpern in die Trachea → Folge Pneumonie. Risiko: Dysphagie, Erbrechen, lange Nahrungskarenz, nach Intubation, Neurologie, Desorientierung, falsche Position, Zahnprothese, Frühgeborene.</p>
<p><b>Maßnahmen:</b> OK hoch während <b>und nach</b> dem Essen (Tisch bevorzugen) · dabei bleiben · Zeit · Mundhygiene danach · Konsistenz anpassen, <b>eindicken</b> (IDDSI 0–7) · Prothese prüfen. <b>Sofort:</b> OK vorbeugen, aushusten, Heimlich, SpO₂ über längere Zeit, beobachten, ggf. CPR, Arzt.</p>
<p><b>ThickenUP:</b> Stufe 1 leicht ×1 · 2 mäßig (Nektar) ×2 · 3 stark (Honig) ×4 · 4 extrem (Pudding) ×6 Messlöffel je 200 ml.</p>
<h3>Dehydratationsprophylaxe</h3>
<p><b>Dehydratation</b> = akuter Wasserverlust; <b>Exsikkose</b> = Folge, mit Elektrolytverschiebung, Volumenmangel, Schock – lebensbedrohlich. Risiko: alte Menschen, Säuglinge, Durst ↓, Diuretika, Fieber, Diarrhoe. Zeichen: Durst, trockene Zunge, kein Speichelsee, <b>stehende Hautfalte</b>, Urin ↓/konzentriert, Tachykardie, Hypotonie, Verwirrtheit, eingesunkene Fontanelle. Maßnahmen: Lieblingsgetränk, Rituale, Trinkprotokoll, Bilanz; ärztliche Trinkmengen beachten.</p>
<h3>Obstipationsprophylaxe</h3>
<p>Obstipation = erschwerte, verzögerte Darmentleerung, harter Stuhl. Ursachen: Ballaststoffe ohne Wasser, Bewegung ↓, Opiate, Unterdrücken des Stuhlgangs, Kaliummangel, Querschnitt. <b>Maßnahmen:</b> trinken, bewegen, Ballaststoffe, Sauermilch, feste Zeiten, Drang nie unterdrücken, Sitzposition (Bauchpresse), Bauchmassage. Medikamente erst wenn das nicht hilft, nach ÄAO (orthograd = Laxanzien, retrograd = Supp./Klistier).</p>
</div><div>
<h3>Ausscheidung – Beobachtung</h3>
<p><b>Stuhl:</b> Defäkation schmerzlos · 100–500 g · Konsistenz (<b>Bristol 1–7</b>: 1 harte Kügelchen … 4 glatte Wurst … 7 wässrig) · Farbe hell–dunkelbraun · Geruch · Beimengungen. FOB-/FIT-Test (okkultes Blut, Darmkrebs), Stuhlkultur (Salmonellen, Shigellen, Campylobacter, E. coli, Clostridien, Noro/Rota).</p>
<p><b>Harn:</b> Miktion willkürlich, schmerzlos, im Strahl · 200–400 ml · hell–dunkelgelb, klar · frisch geruchlos.</p>
<p><b>Uringewinnung:</b> <b>Spontanurin</b> (20–30 ml, jederzeit) · <b>Morgenurin</b> (konzentriert, z. B. Schwangerschaftstest) · <b>Mittelstrahlurin</b> (erste ~3 s verwerfen, 20–40 ml auffangen, Gefäß berührt Körper nicht) · <b>24-h-Sammelurin</b> (quantitativ; 1. Morgenurin verwerfen, Uhrzeit notieren, alles sammeln inkl. Morgenurin am Folgetag, kühl/dunkel; Menge notieren, schwenken, Probe ziehen) · <b>steriler Katheterurin</b> (nur über desinfizierte Punktionsmembran).</p>
<p><b>Harnstreifen</b> (60–120 s): Nitrit +/Leukos → HWI · pH &gt; 8 HWI, &lt; 4 Steine · Eiweiß → Niere · Glukose (&gt; 180 mg/dl) → Diabetes · Ketone → Fasten/Entgleisung · Bilirubin → Leber/Galle · Erythrozyten → Entzündung, Steine. Uricult = Keimzahl + Resistenz (Labor).</p>
<h3>BVWK (transurethraler Blasenverweilkatheter)</h3>
<p>Geschlossenes System – <b>nicht diskonnektieren</b> · Beutel <b>nie über Blasenniveau</b> · je nach Diurese 1–2× tgl. entleeren · ausreichend trinken (Restriktion beachten) · Durchgängigkeit, Menge, Farbe kontrollieren. Material: Pflege → <b>Schleimhaut</b>desinfektion (Octenisept) · Ablassen → <b>Flächen</b>desinfektion · Probe → <b>Haut</b>desinfektion (Kodan) an der Membran. Einzige Ausnahme Urin aus dem Beutel: 24-h-Sammelurin.</p>
<h3>Darmentleerung retrograd (nach AO)</h3>
<p>Suppositorien · Mikroklist (5 ml) · Klistier (100–300 ml). Ablauf: Klistier temperiert · <b>Linksseitenlage</b>, Beine angewinkelt · Spitze mit Vaseline · Anus inspizieren · <b>7–10 cm</b> drehend einführen · Patient presst leicht · unter Aufrollen vollständig einbringen · Schließmuskel zusammenziehen · aufgerollt entfernen · <b>≥ 5 min halten</b> · Rufglocke · Kreislauf/Sturz beobachten · Doku.</p>
<h3>Inkontinenz</h3>
<p><b>Harninkontinenz</b> = unwillkürlicher Urinverlust (Tabu → Rückzug). <b>Formen:</b> Belastungs-/Stress (Husten, Pressen; Verschlussstörung) · Drang (imperativer Harndrang, Detrusor; Apoplex, MS, HWI) · Misch · bei chronischer Retention (Restharn, Überlauf, schmerzlos; Prostata) · funktionell (Toilette nicht rechtzeitig; Kognition/Mobilität, Harntrakt ok).</p>
<p><b>Erhebung:</b> Anamnese, Miktionsprotokoll, Urinbefund, Restharn. <b>Maßnahmen:</b> Gewicht ↓, Obstipationsprophylaxe, trinken, Hautpflege, Autonomie · <b>Blasentraining</b> (Intervalle steigern) · <b>Toilettentraining</b> (15 min vor gewohnter Ausscheidung) · Beckenbodentraining · Hilfsmittel: aufsaugend, auffangend (Kondom-Urinal), ableitend · Umgebung (Haltegriffe, Licht) · Kleidung (Klett, Gummiband).</p>
<p><b>Stuhlinkontinenz</b> Grad 1 gelegentlich Schmieren/Gas · 2 häufig, gelegentlich flüssig · 3 vollständig. <b>IAD</b>: Feuchtigkeit + Harn/Stuhl (flächige Rötung, diffuse Ränder) – <b>Dekubitus</b>: Druck/Scherkräfte.</p>
<h3>Diarrhoe · Nausea/Emesis</h3>
<p><b>Diarrhoe:</b> Flüssigkeit + Elektrolyte, Bilanz, leichte Kost, Analhygiene/Hautschutz, Isolation ggf., Sturzprophylaxe; Antidiarrhoika nur nach AO. <b>Erbrechen:</b> aufrecht oder <b>Seitenlage</b>, Nierentasse, nicht allein lassen, Kleidung lockern, Prothese raus, nach Bauch-OP Wunde mit flacher Hand stützen, Mundpflege, Wäschewechsel; Anamnese (seit wann, Menge, Aussehen, Schwangerschaft?).</p>
</div></div>
</section>

<!-- ============ 8 PÄDIATRIE ============ -->
<section class="sec" id="k8">
<h2>8 · Pädiatrie</h2>
<div class="cols"><div>
<p><b>Frühgeborenes</b> &lt; 37+0 SSW · <b>reif</b> 37+0 – 41+6 · <b>übertragen</b> ≥ 42+0 · <b>Neugeborenenphase</b> bis 28. Lebenstag.</p>
<h3>Säuglingshaut</h3>
<p>pH ~6,7 (Erw. 5–6,5) → Abwehr ↓; Epidermis dünn → resorptionsanfällig → Produkte ohne Alkohol, Parfum, Konservierung. <b>Käseschmiere</b> (Vernix): Gleiten, Wärmeschutz, antibakteriell, ab 18. SSW. Lanugo an Schultern. Nabelschnurrest fällt nach <b>3–14 Tagen</b> ab.</p>
<p><b>Windelbereich:</b> Waschlappen + warmes Wasser (Feuchttücher kühl, schädigen Säureschutzmantel – unterwegs ok); bei intakter Haut keine Creme nötig; Pilz/Bakterien: Textilien 1×, ≥ 60 °C.</p>
<div class="box merk"><b>Windeldermatitis – ABCDE:</b> <b>A</b>ir (windelfrei) · <b>B</b>arrier (Zink-Paste) · <b>C</b>lean (sanft tupfen) · <b>D</b>iapers (häufig wechseln, ~2 h, nach Stuhl) · <b>E</b>ducation (Eltern). Pilz (Candida) → Antimykotikum lt. AO.</div>
<h3>Säuglingsbad</h3>
<p>Wasser <b>36–38 °C</b> (Thermometer unter der Oberfläche ablesen; Verbrühung, Cave Bradykardie), Höhe 10–15 cm, bei Herzfehler nur bis Nabel. Einfach sprechen („Jetzt tauche ich deine Füße ins Wasser“). Halten: linke Hand umgreift linken Oberarm, Kopf auf dem Unterarm; Füße zuerst ins Wasser, <b>zuletzt</b> heraus; Füße spüren Widerstand. Reihenfolge Kopf → Hals → Arme → Oberkörper → Bauch → Beine → Genital <b>vom Schambein zum Anus</b> (verschmutzt: vorher). Mädchen Schamlippen spreizen; Bub Hodensack heben, Vorhaut bis 3 J. nicht zurückschieben. Danach einwickeln, von oben nach unten abtrocknen. Badeeimer: sitzend bis zu den Schultern, &lt; 17,5 kg, 5 l.</p>
<h3>Ganzkörperwaschung Säugling</h3>
<p>Händedesinfektion, Material, Raum <b>≥ 22 °C</b> (Wärmelampe) → Genital zuerst reinigen → Händedesinfektion → Kontakt mit Waschlappen an Stamm/Hand → Gesicht (Augen außen → innen), Kopf, hinter Ohren, Hals → Oberkörper, Arme, Achseln, Hände → Rücken → Beine, Füße, Zehen → Haut inspizieren → wickeln, anziehen. Nie ganz nackt liegen lassen; kinästhetisches Handling.</p>
<p><b>Nabelpflege:</b> Händedesinfektion; trocken &amp; sauber; bei Verschmutzung Wasser + trocknen; sterile Kompresse nur unterlegen; Windel unter dem Nabel umschlagen; Rötung → AO.</p>
<p><b>KIH</b> (Kinästhetik Infant Handling): bewegungsorientiert, fördert Bewegungsfähigkeit &amp; Körperwahrnehmung; Zeit geben, physiologische Muster, über Bewegung kommunizieren.</p>
<h3>Körpermaße</h3>
<p>Perzentilen: 50. = Durchschnitt, 3.–97. = Normalbereich; Verlauf parallel = normal, Kreuzen nach unten → abklären. <b>Gewicht:</b> Waage mit Stoffwindel auf 0, nackt; Geburt 2500–4200 g. <b>Länge:</b> Messmulde, Knie gestreckt, Fußschaufel aufgerichtet; 48–54 cm. <b>Kopfumfang:</b> über Stirn + Hinterhaupt; 33–37 cm. Gewichtsverlust bis 7 % (max. 10 %) in 3–5 Tagen, Geburtsgewicht zurück bis Tag 10–14.</p>
</div><div>
<h3>Vitalparameter Kind</h3>
<p>Je jünger, desto <b>niedriger RR</b>, desto <b>höher HF und AF</b>. Eltern einbinden.</p>
<div class="tw"><table>
<tr><th>Alter</th><th>Puls</th><th>AF</th><th>RR</th></tr>
<tr><td>Neugeborenes</td><td>100–200</td><td>40–50</td><td>70–80 sys</td></tr>
<tr><td>Säugling</td><td>100–220 (bis 3. Mo) · 80–150</td><td>20–30</td><td>65–85 sys</td></tr>
<tr><td>Kleinkind</td><td>70–110 (2–10 J.)</td><td>16–25</td><td>95/90*</td></tr>
<tr><td>Schulkind</td><td>55–90 (ab 10 J.)</td><td>12–20</td><td>100/60 – 110/70</td></tr>
</table></div>
<p class="small">* so auf der Folie (Fley &amp; Schneider) – wirkt wie Tippfehler. MAD = (2 × dia + sys) : 3.</p>
<p><b>Puls:</b> Radialis/Carotis bei jungen Kindern ungeeignet (Fettpolster) → <b>Fontanelle, A. brachialis, A. temporalis</b> oder Auskultation; Carotis nie beidseitig. <b>Atmung:</b> 1 min im Schlaf/ruhig, Hand unter dem Schwertfortsatz. <b>RR:</b> Manschette 2/3, im Zweifel <b>größere</b>; oszillometrisch für niedrige Werte.</p>
<p><b>Temperatur:</b> rektal (Rückenlage oder Seitenlage, Vaseline, Oberschenkel fixieren, Glas max. 3 min) oder Ohr (beim Säugling unzuverlässig). Säuglinge können <b>nicht zittern</b> → braunes Fett; große Oberfläche → schneller Wärmeverlust; Kältestress → O₂-Bedarf ↑, Hypoglykämie.</p>
<p><b>Fieber Kind (S3 2025):</b> &lt; 3 Mo ≥ 38,0 °C rektal → ärztlich abklären; &gt; 3 Mo ≥ 38,5 °C. Ohr ab 1 Jahr genau genug; <b>axillar nicht empfohlen</b>. Senken nicht wegen der Höhe, sondern für Komfort; Antipyretika verhindern Fieberkrämpfe nicht; Wadenwickel nur körperwarm bei warmen Extremitäten; schlafende Kinder nicht wecken. Warnzeichen: Bewusstseinsstörung, Petechien, Rekap &gt; 3 s, Fieber &gt; 3 Tage.</p>
<h3>Entwicklung</h3>
<p><b>Reflexe</b> (Hirnstamm, später gehemmt): <b>Moro</b> (Umklammerung, erster Atemzug) · <b>Greifreflex</b> · <b>Schreitreflex</b> (klingt im 2. Monat ab). Wippe/Maxi-Cosi lange → Bewegungsdrang ↓. <b>Meilenstein</b> = erstes Auftreten; <b>Grenzstein</b> = ~90 % erreicht.</p>
<p><b>Zähne:</b> mittlere Schneidezähne 6.–8. Mo · 20 Milchzähne mit 2,5–3 J. · 32 bleibende. Zahnungszeichen: Speichel, rote Wangen, Unruhe; Hilfe: Beißring, Kühlung, Massage.</p>
<h3>Ernährung 1. Lebensjahr</h3>
<p><b>Beikost</b> nicht vor 17. und nicht nach 26. Woche; Zeichen: Sitzen mit Hilfe, Zungenstoßreflex weg, Interesse. Allergene (Ei, Kuhmilch, Erdnuss, Fisch) <b>nicht meiden</b>. Vit. D3 400 IE bis Ende 12. Mo. Eisen über Beikost (Fleisch; Getreide + Obst/Vit. C); wenig Kuhmilch im 1. Lj.</p>
<p><b>Menge:</b> nach Bedarf alle 2–4 h → 5–6×/Tag; 1.–3. Mo 150–170 ml/kg/Tag. Flüssigkeit 4.–12. Mo 100–150 ml/kg.</p>
<p><b>Industrienahrung:</b> <b>Pre</b> (nur Laktose, ad libitum, ganzes 1. Lj.) · <b>1er</b> (+ Stärke, nicht ad libitum, besser ab 5. Mo) · Folgenahrung 2er/3er nicht nötig · <b>HA</b> bei familiärer Allergie bis Beikost.</p>
<p><b>Muttermilch:</b> Kolostrum (gelb, Protein, IgA) → Übergangsmilch (2–3 Wo.) → reife Milch. Lagerung: Raum 16–25 °C 2–4 h · Kühlschrank ≤ 4 °C 3 Tage (hinten unten) · Gefrierschrank −18 °C 6 Monate · aufgetaut im KS 24 h.</p>
<p><b>Flasche:</b> 37 °C (Handgelenk), Sauger tropft, Flasche steil (keine Luft), aufrecht halten, Füße abgestützt, Pausen + aufstoßen; Doku: Art, Menge, Saugverhalten, Dauer, Spucken. Löffel halb voll, von unten zur Gesichtsmitte, waagrecht herausziehen; nicht mit Getränk hinunterspülen.</p>
<p><b>GÖR:</b> Ursachen: Anti-Reflux-Barriere ↓, Magendruck ↑, verzögerte Entleerung. Säugling: Erbrechen, Gewichtsstillstand → <b>OK-Hochlagerung, kleine Mahlzeiten, Eindicken lt. ÄAO, aufstoßen</b>. Älter: Sodbrennen; PPI 30 min vor Frühstück.</p>
</div></div>
</section>

<!-- ============ 10 MERKHILFEN ============ -->
<section class="sec" id="k10">
<h2>10 · Merkhilfen <i class="ru">mnemonics</i></h2>
<div class="cols"><div>
<ul>
<li><b>GCS „4-5-6“</b> – Augen 4, Sprache 5, Motorik 6 (alphabetisch A-S-M). Minimum 3, nie 0.</li>
<li><b>„Somnolenz – Sopor – Koma“</b> = <b>S-S-K</b>: schläfrig → schläft → schläft nicht mehr auf. <i class="ru">drowsy → asleep → cannot be woken</i></li>
<li><b>Schlaf:</b> „<b>Tief vor Mitternacht, Traum am Morgen</b>“ – 1. Hälfte N3, 2. Hälfte REM.</li>
<li><b>WHO-5:</b> <b>2 × VOR, 3 × NACH</b> – vor Patient, vor aseptisch; nach Material, nach Patient, nach Umgebung.</li>
<li><b>Händedesinfektion:</b> „<b>3 – 30 – 6</b>“: ~3 ml · 30 s · 6 Schritte.</li>
<li><b>Waschen nur bei:</b> Schmutz, WC, Essen, Dienst, <b>C. diff</b> („Sporen lachen über Alkohol“).</li>
<li><b>Puls rot – Temperatur blau</b> („Herz = Blut = rot“).</li>
<li><b>RR-Verbote „LDZ“:</b> <b>L</b>ymphödem · <b>D</b>ialyseshunt · <b>Z</b>ugang (venös/arteriell) – dazu frische Verletzung, Haut-/Knochenerkrankung.</li>
</ul>
</div><div>
<ul>
<li><b>10-R:</b> „<b>PMD-AZ-AA-RDE</b>“ – Person, Medikament, Dosis · Applikation, Zeit · Anwendungsdauer, Aufbewahrung · Risiko, Doku, Entsorgung.</li>
<li><b>Virchow:</b> „<b>Strom – Wand – Blut</b>“.</li>
<li><b>EDEKA:</b> Empfindlichkeit, Diät, Einschränkung, Krankheit, Allergie.</li>
<li><b>BVWK:</b> „<b>Unten und zu</b>“ – Beutel unter Blasenniveau, System geschlossen.</li>
<li><b>Desinfektion BVWK:</b> <b>S</b>chleimhaut = Pflege · <b>F</b>läche = Ablassen · <b>H</b>aut = Probe an Membran.</li>
<li><b>Klistier:</b> „<b>Links liegen, 7–10, 5 Minuten</b>“.</li>
<li><b>Säugling Bad:</b> „<b>Füße zuerst rein, Füße zuletzt raus</b>“.</li>
<li><b>Windeldermatitis A-B-C-D-E:</b> Air, Barrier, Clean, Diapers, Education.</li>
<li><b>Zahnpasta Kind:</b> Reis (bis 2) → Erbse (2–6) → Bürstenkopf (ab 6).</li>
<li><b>Muttermilch:</b> „<b>4 h – 3 Tage – 6 Monate</b>“ (Raum – Kühlschrank – Gefrierer).</li>
</ul>
</div></div>
</section>

<!-- ============ 11 FALLEN ============ -->
<section class="sec" id="k11">
<h2>11 · Fallen – Widersprüche &amp; Verwechsler</h2>
<div class="cols fallen"><div>
<ol>
<li><b>Verneinte Fragen</b> („Was ist <b>NICHT</b> …?“, „<b>FALSCH</b>“) – Signalwort zuerst markieren. <i class="ru">look for the WRONG ones</i></li>
<li><b>Puls Erwachsene:</b> Folie/Pocketguide <b>60–80</b> Normwert, aber Tachy erst &gt; 100, Brady &lt; 60. 60–100 = „nicht pathologisch“.</li>
<li><b>Puls/AF Neugeborenes:</b> VF-Folie P 120–140, AF 30–50 · Pädiatrie-Folie P 100–200, AF 40–50. Frage nach Quelle/Kontext lesen.</li>
<li><b>AF Erwachsene:</b> 12–18 (VF, Pocketguide) vs. 12–20 (Pädiatrie-Tabelle); Tachypnoe „&gt; 18–20“ bzw. „&gt; 20“.</li>
<li><b>Fieber:</b> Definition &gt; 38,0 °C (VF) · Pocketguide „ab 38,1“ · Kinder &gt; 3 Mo erst ≥ 38,5 °C (S3), &lt; 3 Mo ≥ 38,0.</li>
<li><b>Axillar messen:</b> VF-Folie listet Achsel als Messort – S3-Leitlinie Kinder: <b>nicht empfohlen</b>.</li>
<li><b>Wadenwickel:</b> VF „in der Fieberhöhe“ · S3 Kinder: nur körperwarm, nur bei warmen Extremitäten.</li>
<li><b>Hypotonie:</b> &lt; 105/60 (Folie) – nicht 100/60 oder 90/60.</li>
<li><b>GCS-Begriffe:</b> Skript „gezielte/ungezielte Abwehr, Beuge-/Strecksynergien“ vs. Teasdale-Bogen „lokalisiert, beugt normal/abnormal, streckt“ + „NT“. Punkte gleich.</li>
<li><b>Händewaschen ersetzt Desinfektion?</b> Nie. Ausnahme-Reihenfolge C. difficile: <b>erst desinfizieren, dann waschen</b>.</li>
</ol></div><div>
<ol start="11">
<li><b>MTS:</b> Handout „Basismaßnahme lt. AA“ · Schellong/GAPS 2020: zusätzlich zu Heparin <b>kein Zusatznutzen</b>; Einschnürung kann Thrombose fördern.</li>
<li><b>Säugling baden:</b> Handout 1–2×/Woche (pH-Schutz) · JuKiP 2019: <b>2–3×/Woche</b>, Baden besser als Waschen; Wasser 36–38 vs. 37–38 °C.</li>
<li><b>pH Säuglingshaut:</b> 6,7 (Handout) vs. ~7,0 (JuKiP); Erw. 5–6,5 vs. 5,4–5,9.</li>
<li><b>Feuchttücher:</b> Handout: schädigen Säureschutzmantel · JuKiP 2024: alkohol-/duftstofffreie ok.</li>
<li><b>Windelwechsel:</b> ~2 h (Handout) vs. 2–4 h (JuKiP). <b>Schwarztee:</b> Interview empfiehlt · JuKiP: keine Evidenz, bei Wunden kontraindiziert.</li>
<li><b>Beikost:</b> 17.–26. Woche (Folie) · „frühestens 5., spätestens 7. Monat“ (Allergie-Artikel) · 2. Lebenshalbjahr (Beikost-Artikel).</li>
<li><b>HA-Nahrung:</b> Folie empfiehlt bei Allergierisiko · up2date: EFSA hat <b>keinen</b> allergiepräventiven Effekt anerkannt.</li>
<li><b>Alarmsysteme:</b> zur Sturzprävention <b>nicht</b> empfohlen – aber als <b>gelindere</b> Alternative zu FbM sinnvoll.</li>
<li><b>IAD ≠ Dekubitus ≠ Intertrigo:</b> Feuchtigkeit+Ausscheidung / Druck+Scherkräfte / Feuchtigkeit+Wärme in Hautfalten.</li>
<li><b>Dehydratation ≠ Exsikkose:</b> Vorgang (Wasserverlust) vs. Folge (+ Elektrolyte, Schock).</li>
<li><b>Hyperthermie ≠ Fieber:</b> ohne vs. mit Sollwerterhöhung.</li>
<li><b>Pharmakokinetik ≠ -dynamik:</b> Körper → Stoff vs. Stoff → Körper.</li>
</ol></div></div>
</section>
